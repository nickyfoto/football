<!doctype html><html><head><style>html,body{margin:0;width:1024px;height:1024px;background:#c8102e}</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.55" stop-color="#e01e3c"/>
      <stop offset="1" stop-color="#8e0b25"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#5a0014" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- pulse rings -->
  <g fill="none" stroke="#ffffff">
    <circle cx="512" cy="540" r="330" stroke-opacity="0.10" stroke-width="10"/>
    <circle cx="512" cy="540" r="415" stroke-opacity="0.06" stroke-width="10"/>
  </g>
  <!-- press chevrons: hands pushing down -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
    <polyline points="432,150 512,205 592,150" stroke-opacity="0.55"/>
    <polyline points="432,225 512,280 592,225" stroke-opacity="0.9"/>
  </g>
  <!-- heart -->
  <path filter="url(#shadow)" fill="url(#heart)"
    d="M512 850
       C 470 812, 250 650, 214 512
       C 180 380, 262 300, 360 300
       C 430 300, 482 340, 512 392
       C 542 340, 594 300, 664 300
       C 762 300, 844 380, 810 512
       C 774 650, 554 812, 512 850 Z"/>
  <!-- heartbeat line -->
  <polyline fill="none" stroke="#e01e3c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"
    points="268,548 400,548 448,468 508,650 566,420 616,548 756,548"/>
</svg></body></html>
