<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blitz Breaker Online - NFL Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Russo One', sans-serif;
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.75);
            border-bottom: 4px solid #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            text-transform: uppercase;
        }
        .interactive-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto; /* Catch clicks for buttons */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 10;
        }
        .hidden { display: none !important; }

        /* Scoped by id so Tailwind's injected preflight reset can't strip the button styling */
        #game-container button {
            background: #e53e3e; /* Red-600 */
            color: white;
            border: 4px solid white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Russo One', sans-serif;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.2s;
            pointer-events: auto;
        }
        #game-container button:active {
            transform: scale(0.95);
        }
        #game-container button:hover {
            background: #c53030;
        }
        #game-container .btn-small {
            padding: 10px 22px;
            font-size: 1.1rem;
        }
        #game-container .btn-ghost {
            background: transparent;
            border-color: rgba(255,255,255,0.6);
            box-shadow: none;
            padding: 10px 28px;
            font-size: 1.1rem;
        }
        #game-container .btn-ghost:hover {
            background: rgba(255,255,255,0.12);
        }

        .code-input {
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 4px solid #fff;
            border-radius: 8px;
            padding: 10px 14px;
            width: 10.5rem;
            font-family: 'Russo One', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 6px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }
        .code-input:focus { border-color: #fbbf24; }
        .code-input::placeholder { color: #6b7280; letter-spacing: 3px; }
        .room-code {
            font-size: 3.5rem;
            color: #fbbf24;
            letter-spacing: 10px;
            text-shadow: 3px 3px 0 #000;
        }
        .share-link {
            background: rgba(0,0,0,0.6);
            color: #d1d5db;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 6px;
            padding: 10px;
            width: min(16rem, 80vw);
            font-family: sans-serif;
            font-size: 0.8rem;
            outline: none;
        }
        .menu-status {
            color: #d1d5db;
            min-height: 1.5rem;
            max-width: 28rem;
            padding: 0 16px;
            text-align: center;
            letter-spacing: 1px;
        }
        #status-banner {
            margin: 4px auto 0;
            width: fit-content;
            max-width: 90%;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 6px 14px;
            color: #fbbf24;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-align: center;
        }

        .message-text {
            font-size: 3rem;
            color: #fbbf24; /* Amber-400 */
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            margin-bottom: 20px;
            text-align: center;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .team-blue { color: #60a5fa; }
        .team-red { color: #f87171; }
        .stat-box { text-align: center; }
        .stat-value { font-size: 1.25rem; color: #fff;}
        .stat-label { font-size: 0.75rem; color: #aaa; letter-spacing: 1px;}
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Heads Up Display -->
    <div class="ui-layer" id="hud" style="display: none;">
        <div class="hud-panel">
            <div class="stat-box">
                <div class="stat-label" id="clockLabel">CLOCK</div>
                <div class="stat-value" id="timerDisplay" style="color:#fbbf24">5:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label" id="possessionDisplay">BLUE BALL</div>
                <div class="stat-value" id="scoreDisplay">
                    <span class="team-blue">0</span> - <span class="team-red">0</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-label">DOWN & DISTANCE</div>
                <div class="stat-value" id="downDisplay" style="color:#fbbf24">1ST & 10</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">BALL ON</div>
                <div class="stat-value" id="yardLineDisplay" style="color:#fbbf24">OWN 20</div>
            </div>
        </div>
        <!-- Bottom instruction area -->
        <div id="mobile-instruction" class="text-white text-center p-4 opacity-50 text-sm tracking-wider">
            DRAG TO MOVE • ARROW KEYS TO RUN • E TO HANDOFF
        </div>
        <div id="status-banner" class="hidden"></div>
    </div>

    <!-- Start / Lobby / Game Over Screen -->
    <div id="overlay-menu" class="interactive-overlay">
        <h1 id="menu-title" class="text-5xl md:text-7xl text-white mb-2 text-center" style="text-shadow: 3px 3px 0 #000;">BLITZ<span class="text-red-500"> BREAKER</span></h1>
        <p id="menu-subtitle" class="text-gray-300 mb-8 max-w-md text-center px-4"></p>

        <div id="panel-home" class="flex flex-col items-center gap-5">
            <button id="host-btn">CREATE GAME</button>
            <div class="flex items-center gap-3">
                <input id="join-input" class="code-input" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
                <button id="join-btn" class="btn-small" style="background: #2563eb;">JOIN</button>
            </div>
            <button id="solo-btn" class="btn-ghost">PLAY SOLO</button>
            <div id="home-status" class="menu-status"></div>
        </div>

        <div id="panel-lobby" class="hidden flex flex-col items-center gap-5">
            <div id="room-box" class="hidden flex flex-col items-center gap-2">
                <div class="stat-label">ROOM CODE</div>
                <div id="room-code" class="room-code">-----</div>
                <div class="flex flex-wrap items-center justify-center gap-2">
                    <input id="share-link" class="share-link" readonly>
                    <button id="copy-btn" class="btn-small" style="background: #2563eb;">COPY LINK</button>
                </div>
            </div>
            <div id="lobby-status" class="menu-status"></div>
            <button id="start-btn" class="hidden">KICK OFF</button>
            <button id="leave-btn" class="btn-ghost">LEAVE</button>
        </div>
    </div>

    <!-- In-Game State Messages (Touchdown, First Down, etc) -->
    <div id="overlay-message" class="interactive-overlay hidden" style="background: rgba(0,0,0,0.3); pointer-events: none;">
        <div class="message-text" id="big-message">TOUCHDOWN!</div>
    </div>

    <!-- Snap Ball Button -->
    <div id="overlay-snap" class="interactive-overlay hidden" style="background: rgba(0,0,0,0.1);">
        <button id="snap-btn" style="background: #2563eb; border-color: #fff;">SNAP BALL</button>
    </div>

    <!-- Kick PAT Button -->
    <div id="overlay-kick" class="interactive-overlay hidden" style="background: rgba(0,0,0,0.1);">
        <button id="kick-btn" style="background: #10b981; border-color: #fff;">KICK PAT</button>
    </div>

    <!-- Punt Button -->
    <div id="overlay-punt" class="interactive-overlay hidden" style="background: rgba(0,0,0,0.1);">
        <button id="punt-btn" style="background: #3b82f6; border-color: #fff;">PUNT BALL</button>
    </div>

    <!-- Handoff Button (Mobile/Touch) -->
    <button id="handoff-btn" class="hidden" style="position: absolute; bottom: 20px; left: 20px; background: #ea580c; border-color: #fff; padding: 15px 25px; font-size: 1.2rem; z-index: 20; border-radius: 8px;">HANDOFF</button>

    <!-- Pass Button (Mobile/Touch) -->
    <button id="pass-btn" class="hidden" style="position: absolute; bottom: 20px; right: 20px; background: #8b5cf6; border-color: #fff; padding: 15px 25px; font-size: 1.2rem; z-index: 20; border-radius: 8px;">PASS</button>

    <!-- Switch Defender Button (Mobile/Touch, defense only) -->
    <button id="switch-btn" class="hidden" style="position: absolute; bottom: 20px; right: 20px; background: #d97706; border-color: #fff; padding: 15px 25px; font-size: 1.2rem; z-index: 20; border-radius: 8px;">SWITCH</button>
</div>

<script>
    /**
     * BLITZ BREAKER ONLINE - HTML5 Canvas Game Engine
     *
     * Two-player games are host-authoritative: the player who creates the room (BLUE) runs the
     * simulation and streams snapshots to the player who joins (RED) over a WebRTC data channel
     * (PeerJS, so no game server is needed). Whoever has the ball controls the ball carrier; the
     * other player controls one defender and can switch to whichever defender is closest to the ball.
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const overlayMenu = document.getElementById('overlay-menu');
    const menuTitle = document.getElementById('menu-title');
    const menuSubtitle = document.getElementById('menu-subtitle');
    const panelHome = document.getElementById('panel-home');
    const panelLobby = document.getElementById('panel-lobby');
    const hostBtn = document.getElementById('host-btn');
    const joinInput = document.getElementById('join-input');
    const joinBtn = document.getElementById('join-btn');
    const soloBtn = document.getElementById('solo-btn');
    const homeStatus = document.getElementById('home-status');
    const roomBox = document.getElementById('room-box');
    const roomCodeEl = document.getElementById('room-code');
    const shareLink = document.getElementById('share-link');
    const copyBtn = document.getElementById('copy-btn');
    const lobbyStatus = document.getElementById('lobby-status');
    const startBtn = document.getElementById('start-btn');
    const leaveBtn = document.getElementById('leave-btn');

    const hudEl = document.getElementById('hud');
    const overlayMessage = document.getElementById('overlay-message');
    const bigMessage = document.getElementById('big-message');
    const statusBanner = document.getElementById('status-banner');
    const instructionEl = document.getElementById('mobile-instruction');

    const overlaySnap = document.getElementById('overlay-snap');
    const snapBtn = document.getElementById('snap-btn');
    const overlayKick = document.getElementById('overlay-kick');
    const kickBtn = document.getElementById('kick-btn');
    const overlayPunt = document.getElementById('overlay-punt');
    const puntBtn = document.getElementById('punt-btn');
    const passBtn = document.getElementById('pass-btn');
    const handoffBtn = document.getElementById('handoff-btn');
    const switchBtn = document.getElementById('switch-btn');

    // HUD Text Elements
    const clockLabel = document.getElementById('clockLabel');
    const timerDisplay = document.getElementById('timerDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const possessionDisplay = document.getElementById('possessionDisplay');
    const downDisplay = document.getElementById('downDisplay');
    const yardLineDisplay = document.getElementById('yardLineDisplay');

    // --- GAME CONSTANTS & VARIABLES ---
    const FIELD_WIDTH_YARDS = 53.3;
    const FIELD_LENGTH_YARDS = 100;

    const STEP_MS = 1000 / 60;   // Fixed simulation step (all speeds are tuned per 60fps frame)
    const SNAPSHOT_MS = 33;      // Host -> guest state rate
    const INTERP_MS = 80;        // Guest renders this far behind the host to smooth out network jitter
    const PEER_PREFIX = 'blitzbreaker-v6-';
    const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const TEAM_NAME = { HOME: 'BLUE', AWAY: 'RED' };
    const other = (side) => side === 'HOME' ? 'AWAY' : 'HOME';

    let ppy = 10;
    let cameraY = 0;

    // Game States: MENU, PRE_SNAP, PLAYING, PASS_IN_AIR, ANIMATING, FIELD_GOAL_AIMING, FIELD_GOAL_KICKED,
    //              PUNT_AIMING, PUNT_KICKED, KICKOFF_IN_AIR, GAME_OVER
    let gameState = 'MENU';
    let difficultyLevel = 1;
    let gameGen = 0; // Bumped on every start/stop so stale message callbacks from an old game are dropped

    // Time & Football Rules State
    let gameTimeRemaining = 300; // 5 minutes (in seconds)
    let timeExpired = false;
    let isOvertime = false;

    let scoreHome = 0;
    let scoreAway = 0;
    let possession = 'HOME'; // 'HOME' (Blue) or 'AWAY' (Red)
    let down = 1;
    let lineOfScrimmage = 20; // Starts at own 20
    let firstDownLine = 30;

    // Camera hints from the simulation (so host and guest frame the same action on any screen size)
    let camFocusY = null; // null = follow the ball carrier
    let camCut = 0;       // Bumped when the camera should jump instead of pan

    // Entities
    const player = {
        x: FIELD_WIDTH_YARDS / 2,
        y: 20,
        radius: 0.8,
        baseSpeed: 0.16,
        speed: 0.16,
        vx: 0,
        vy: 0,
        color: '#3b82f6'
    };

    let defenders = [];

    // Field Goal & Kickoff minigame variables
    let kickingMeter = { pos: 50, dir: 1, speed: 2 };
    let kickedBall = { active: false, x: 0, y: 0, vx: 0, vy: 0, size: 1, timer: 0, startX: 0, startY: 0, isBlocked: false };
    let isTwoPointConversion = false;
    let isKickoffReturn = false;
    let isPAT = false;
    let returners = [];
    let kickoffTargetX = 0;
    let kickoffTargetY = 0;

    // Passing Mechanics Variables
    let hasCrossedLOS = false;
    let wrs = [];
    let oLinemen = [];
    let rb = { active: false, x: 0, y: 0, speed: 0, color: '' }; // Running Back
    let cosmeticQB = null;
    let passObj = { active: false, x: 0, y: 0, startDist: 0, size: 1, targetWrIndex: -1 };

    // HUD state is written by the simulation and rendered by every client
    const hudState = { clk: '5:00', cl: 'CLOCK', sh: 0, sa: 0, pd: 'HOME', dd: '1ST & 10', yd: 'OWN 20', kb: 'KICK PAT' };

    // Input State
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false, e: false };
    const pointer = { active: false, x: 0, y: 0 };
    const localInput = { mx: 0, my: 0 };  // This client's movement direction
    const remoteInput = { mx: 0, my: 0 }; // Host only: the guest's latest movement direction
    const NO_INPUT = { mx: 0, my: 0 };

    // --- NETWORK STATE ---
    const net = {
        role: 'solo',     // 'solo' | 'host' | 'guest'
        peer: null,
        conn: null,
        code: null,
        connected: false, // Handshake finished, both players present
        lastRecv: 0,
        rtt: null
    };
    let mySide = 'HOME';

    // --- SOUND ENGINE (Web Audio API) ---
    const sfx = {
        ctx: null,
        init() {
            if (!this.ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume();
        },
        playOsc(freq, type, duration, vol = 0.1, slideFreq = null) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideFreq) {
                osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
            }
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        playNoise(duration, vol=0.1) {
            if (!this.ctx) return;
            const bufferSize = this.ctx.sampleRate * duration;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        },
        whistle() {
            this.playOsc(2000, 'sine', 0.4, 0.1);
            setTimeout(() => this.playOsc(2200, 'sine', 0.5, 0.1), 100);
        },
        tackle() {
            this.playOsc(150, 'sine', 0.3, 0.3, 50);
            this.playNoise(0.2, 0.4);
        },
        kick() {
            this.playOsc(200, 'sine', 0.15, 0.4, 40);
        },
        success() {
            this.playOsc(440, 'square', 0.1, 0.05);
            setTimeout(() => this.playOsc(554, 'square', 0.2, 0.05), 100);
            setTimeout(() => this.playOsc(659, 'square', 0.4, 0.05), 200);
        },
        fail() {
            this.playOsc(300, 'sawtooth', 0.5, 0.1, 150);
        },
        touchdown() {
            const notes = [440, 554, 659, 880];
            notes.forEach((freq, i) => {
                setTimeout(() => this.playOsc(freq, 'square', 0.5, 0.05), i * 150);
            });
            setTimeout(() => {
                if(!this.ctx) return;
                const noise = this.ctx.createBufferSource();
                const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for(let i=0; i<buffer.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + 0.5);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }, 100);
        }
    };

    // Named sounds so the host can replay them on the guest's machine
    const SOUNDS = {
        whistle: () => sfx.whistle(),
        tackle: () => sfx.tackle(),
        kick: () => sfx.kick(),
        success: () => sfx.success(),
        fail: () => sfx.fail(),
        touchdown: () => sfx.touchdown(),
        juke: () => sfx.playOsc(800, 'sine', 0.15, 0.1, 300),
        stiffArm: () => sfx.playNoise(0.1, 0.3),
        throw: () => sfx.playNoise(0.2, 0.1)
    };
    function fx(name) {
        SOUNDS[name]();
        emit({ k: 'sfx', n: name });
    }

    // Browsers only allow audio after a user gesture
    ['pointerdown', 'keydown', 'touchstart'].forEach(evt => window.addEventListener(evt, () => sfx.init(), { passive: true }));

    // --- INITIALIZATION & RESIZING ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ppy = canvas.width / FIELD_WIDTH_YARDS;
        if (ppy > canvas.height / 30) ppy = canvas.height / 30;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- INPUT HANDLING ---
    const isInGame = () => gameState !== 'MENU' && gameState !== 'GAME_OVER' && overlayMenu.classList.contains('hidden');

    // Keys are read by physical position (e.code) so WASD/Q/E sit in the same place on any keyboard layout
    const KEY_BY_CODE = {
        KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyE: 'e', KeyQ: 'q', Space: ' ',
        Digit1: '1', Digit2: '2', Digit3: '3', Numpad1: '1', Numpad2: '2', Numpad3: '3',
        ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight'
    };
    function gameKey(e) {
        if (e.code && e.code !== 'Unidentified') return KEY_BY_CODE[e.code] || '';
        return e.key.length === 1 ? e.key.toLowerCase() : e.key; // Some virtual keyboards send no code
    }

    window.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;
        const k = gameKey(e);
        if (keys.hasOwnProperty(k)) keys[k] = true;
        if (!isInGame()) return;
        if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
        if (e.repeat) return;
        if (k === ' ') doAction('primary');
        else if (k === 'e') doAction('handoff');
        else if (k === 'q') doAction('switch');
        else if (k === '1' || k === '2' || k === '3') doAction('pass', Number(k) - 1);
    });
    window.addEventListener('keyup', (e) => {
        const k = gameKey(e);
        if (keys.hasOwnProperty(k)) keys[k] = false;
    });
    window.addEventListener('blur', () => {
        for (let k in keys) keys[k] = false;
        pointer.active = false;
    });

    function handlePointerDown(e) {
        if (!isInGame()) return;
        pointer.active = true;
        updatePointerPos(e);
    }
    function handlePointerMove(e) {
        if (!pointer.active) return;
        updatePointerPos(e);
    }
    function handlePointerUp() { pointer.active = false; }
    function updatePointerPos(e) {
        pointer.x = e.touches ? e.touches[0].clientX : e.clientX;
        pointer.y = e.touches ? e.touches[0].clientY : e.clientY;
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
    window.addEventListener('touchend', handlePointerUp);

    function onClick(btn, handler) {
        btn.addEventListener('click', (e) => { e.currentTarget.blur(); handler(); });
    }
    onClick(snapBtn, () => doAction('snap'));
    onClick(kickBtn, () => doAction('kick'));
    onClick(puntBtn, () => doAction('punt'));
    onClick(passBtn, () => doAction('pass', -1));
    onClick(handoffBtn, () => doAction('handoff'));
    onClick(switchBtn, () => doAction('switch'));

    onClick(hostBtn, createRoom);
    onClick(joinBtn, () => joinRoom(joinInput.value));
    onClick(soloBtn, startSolo);
    onClick(startBtn, startGame);
    onClick(leaveBtn, () => leaveToHome());
    onClick(copyBtn, copyShareLink);
    joinInput.addEventListener('input', () => {
        joinInput.value = joinInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });
    joinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(joinInput.value); });

    // The entity this client steers: the ball carrier on offense, the highlighted defender on defense
    function myControlledEntity() {
        if (net.role === 'solo' || possession === mySide) return player;
        return defenders.find(d => d.human) || null;
    }

    let lastInputSent = { mx: 0, my: 0, t: 0 };
    function computeLocalInput(now) {
        let mx = 0, my = 0;
        if (keys.ArrowUp || keys.w) my = 1; if (keys.ArrowDown || keys.s) my = -1;
        if (keys.ArrowLeft || keys.a) mx = -1; if (keys.ArrowRight || keys.d) mx = 1;

        const ent = myControlledEntity();
        if (pointer.active && ent) {
            const dx = pointer.x - getScreenX(ent.x); const dy = pointer.y - getScreenY(ent.y);
            const distance = Math.hypot(dx, dy);
            if (distance > 10) { mx = dx / distance; my = -dy / distance; }
        }
        if (mx !== 0 && my !== 0 && !pointer.active) {
            const length = Math.hypot(mx, my); mx /= length; my /= length;
        }
        localInput.mx = Math.round(mx * 100) / 100;
        localInput.my = Math.round(my * 100) / 100;

        if (net.role === 'guest' && net.connected) {
            const changed = localInput.mx !== lastInputSent.mx || localInput.my !== lastInputSent.my;
            if (changed || now - lastInputSent.t > 250) {
                send({ type: 'in', mx: localInput.mx, my: localInput.my });
                lastInputSent = { mx: localInput.mx, my: localInput.my, t: now };
            }
        }
    }

    function offenseInput() {
        if (net.role === 'solo') return localInput;
        return possession === mySide ? localInput : remoteInput;
    }
    function defenseInput() {
        if (net.role !== 'host') return NO_INPUT;
        return possession === mySide ? remoteInput : localInput;
    }

    // Buttons and keys become actions; the guest forwards them to the host, which owns the game
    function doAction(a, arg) {
        if (net.role === 'guest') send({ type: 'act', a, arg });
        else handleAction(mySide, a, arg);
    }

    function handleAction(side, a, arg) {
        const onOffense = net.role === 'solo' || side === possession;
        if (a === 'primary') {
            if (!onOffense) { switchDefender(); return; }
            if (gameState === 'PRE_SNAP') snapBall();
            else if (gameState === 'FIELD_GOAL_AIMING') executeKick();
            else if (gameState === 'PUNT_AIMING') executePunt();
            else if (gameState === 'PLAYING') throwPass(-1);
        }
        else if (a === 'snap') { if (onOffense) snapBall(); }
        else if (a === 'kick') { if (onOffense && gameState === 'FIELD_GOAL_AIMING') executeKick(); }
        else if (a === 'punt') { if (onOffense && gameState === 'PUNT_AIMING') executePunt(); }
        else if (a === 'pass') { if (onOffense) throwPass(Number.isInteger(arg) ? arg : -1); }
        else if (a === 'handoff') { if (onOffense) handoffBall(); }
        else if (a === 'switch') { if (!onOffense) switchDefender(); }
    }

    // --- HUMAN-CONTROLLED DEFENDER ---
    const humanDefense = () => net.role === 'host';
    const humanDefSpeed = () => player.baseSpeed * 1.02;

    function setHumanDefender(index) {
        defenders.forEach((d, i) => { d.human = (i === index); });
    }

    function nearestDefenderIndex(x, y, excludeIndex = -1) {
        let best = -1; let bestDist = Infinity;
        defenders.forEach((d, i) => {
            if (i === excludeIndex) return;
            const dist = Math.hypot(d.x - x, d.y - y);
            if (dist < bestDist) { bestDist = dist; best = i; }
        });
        return best;
    }

    function switchDefender() {
        if (!humanDefense() || defenders.length < 2) return;
        if (!['PRE_SNAP', 'PLAYING', 'PASS_IN_AIR', 'KICKOFF_IN_AIR'].includes(gameState)) return;
        const current = defenders.findIndex(d => d.human);
        let next;
        if (gameState === 'PRE_SNAP') {
            next = (current + 1) % defenders.length; // Cycle so any defender can be picked before the snap
        } else if (gameState === 'PASS_IN_AIR') {
            const target = wrs[passObj.targetWrIndex];
            next = nearestDefenderIndex(target.x, target.y, current);
        } else if (gameState === 'KICKOFF_IN_AIR') {
            next = nearestDefenderIndex(kickoffTargetX, kickoffTargetY, current);
        } else {
            next = nearestDefenderIndex(player.x, player.y, current);
        }
        if (next !== -1) setHumanDefender(next);
    }

    // Moves the human defender by the defense player's input. Returns true if it moved.
    function moveHumanDefender(speedMul = 1, minY = null, respectBlocks = false) {
        const def = defenders.find(d => d.human);
        if (!def || def.stunTimer > 0) return false;
        const inp = defenseInput();
        if (inp.mx === 0 && inp.my === 0) return false;
        let speed = humanDefSpeed() * speedMul;
        if (respectBlocks && def.engaged) speed *= 0.20;
        def.x += inp.mx * speed; def.y += inp.my * speed;
        def.x = Math.max(def.radius, Math.min(FIELD_WIDTH_YARDS - def.radius, def.x));
        def.y = Math.max(-10, Math.min(110, def.y));
        if (minY !== null) def.y = Math.max(minY, def.y);
        return true;
    }

    // Blockers pick up AI rushers by role; a human defender is picked up whenever he comes close
    function isBlockable(def, blocker) {
        if (def.human) return Math.hypot(def.x - blocker.x, def.y - blocker.y) < 3;
        return !def.isCB && !def.isSafety && !def.isSpy && !def.isRBCover;
    }

    // --- CORE GAME LOGIC ---

    function startSolo() {
        closeNet();
        net.role = 'solo';
        mySide = 'HOME';
        startGame();
    }

    function startGame() {
        if (net.role === 'host' && !net.connected) return;
        sfx.init();
        gameGen++;

        // Reset Game Variables
        scoreHome = 0;
        scoreAway = 0;
        possession = 'HOME'; // Start with HOME receiving opening kick
        difficultyLevel = 1;
        gameTimeRemaining = 300;
        timeExpired = false;
        isOvertime = false;
        isTwoPointConversion = false;
        isKickoffReturn = false;
        isPAT = false;
        hudState.cl = 'CLOCK';
        simAcc = 0;
        simLast = performance.now();

        overlayMenu.classList.add('hidden');
        hudEl.style.display = 'block';

        if (net.role === 'host') send({ type: 'start' });
        fx('whistle');
        setupKickoff(); // Begin game with a kickoff!
    }

    function stopGame() {
        gameGen++;
        gameState = 'MENU';
        hudEl.style.display = 'none';
        overlayMessage.classList.add('hidden');
        pointer.active = false;
        snapBuffer.length = 0;
        eventQueue.length = 0;
    }

    function resetDrive(startYard) {
        lineOfScrimmage = startYard;
        down = 1;
        firstDownLine = lineOfScrimmage + 10;
        setupPreSnap();
    }

    function executeTurnover(newLOS) {
        possession = possession === 'HOME' ? 'AWAY' : 'HOME';

        let teamColor = possession === 'HOME' ? '#60a5fa' : '#f87171';
        let msg = possession === 'HOME' ? 'BLUE BALL!' : 'RED BALL!';

        showBigMessage(msg, teamColor, () => {
            if (timeExpired) { handleTimeExpired(); return; }
            resetDrive(newLOS);
        });
    }

    function executeKickoff() {
        possession = possession === 'HOME' ? 'AWAY' : 'HOME';
        setupKickoff();
    }

    function handleTimeExpired() {
        if (scoreHome === scoreAway && !isOvertime) {
            isOvertime = true;
            gameTimeRemaining = 120; // 2 minutes for Sudden Death OT
            timeExpired = false;
            gameState = 'ANIMATING';
            hudState.cl = 'OT CLOCK';

            // Random "Coin Toss" for OT Possession
            possession = Math.random() > 0.5 ? 'HOME' : 'AWAY';

            fx('whistle');
            showBigMessage("OVERTIME!", "#fbbf24", () => {
                setupKickoff();
            }, 3000);
            return;
        }

        endGame("TIME'S UP!");
    }

    function endGame(reasonMessage) {
        gameState = 'GAME_OVER';

        fx('whistle');
        setTimeout(() => fx('whistle'), 400);
        setTimeout(() => fx('whistle'), 800);

        let winMsg = "TIE GAME!";
        let winColor = "#fff";
        if (scoreHome > scoreAway) {
            winMsg = "BLUE WINS!";
            winColor = "#60a5fa";
        } else if (scoreAway > scoreHome) {
            winMsg = "RED WINS!";
            winColor = "#f87171";
        }

        showBigMessage(reasonMessage, "#fbbf24", () => {
            const subtitle = `Final Score: Blue ${scoreHome} - Red ${scoreAway}`;
            emit({ k: 'over', title: winMsg, color: winColor, sub: subtitle });
            showGameOver(winMsg, winColor, subtitle);
        }, 3000);
    }

    function setupKickoff() {
        gameState = 'ANIMATING';
        isKickoffReturn = true;
        kickedBall.active = true;
        kickedBall.isBlocked = false;
        hasCrossedLOS = false;
        isTwoPointConversion = false;

        const pColor = possession === 'HOME' ? '#3b82f6' : '#ef4444';
        const olColor = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';
        const defMain = possession === 'HOME' ? '#ef4444' : '#3b82f6';

        player.color = pColor;

        // Kicking team
        defenders = [];
        for(let i=0; i<11; i++) {
            defenders.push({
                x: (FIELD_WIDTH_YARDS / 12) * (i + 1),
                y: 65,
                radius: 0.85,
                speed: player.speed * (1.1 + Math.random() * 0.2),
                color: defMain,
                targetWrIndex: -1,
                isDL: false, isCB: false, isSafety: false, isSpy: false, isRBCover: false
            });
        }
        if (humanDefense()) setHumanDefender(5);

        // Return blockers (Wedge format)
        oLinemen = [];
        for(let i=0; i<5; i++) oLinemen.push({x: (FIELD_WIDTH_YARDS / 6) * (i+1), y: 35, radius: 0.9, color: olColor});
        for(let i=0; i<4; i++) oLinemen.push({x: (FIELD_WIDTH_YARDS / 5) * (i+1), y: 20, radius: 0.9, color: olColor});

        returners = [
            {x: FIELD_WIDTH_YARDS * 0.3, y: 5, speed: player.baseSpeed * 1.20, color: pColor},
            {x: FIELD_WIDTH_YARDS * 0.7, y: 5, speed: player.baseSpeed * 1.20, color: pColor}
        ];

        wrs = []; rb.active = false; cosmeticQB = null; passObj.active = false;

        kickoffTargetX = 10 + Math.random() * 33;
        kickoffTargetY = -5 + Math.random() * 15;

        kickedBall.startX = FIELD_WIDTH_YARDS / 2;
        kickedBall.startY = 65;
        kickedBall.x = kickedBall.startX;
        kickedBall.y = kickedBall.startY;
        kickedBall.timer = 0;

        updateHUD();
        camFocusY = 20;
        camCut++;

        let teamText = possession === 'HOME' ? 'BLUE' : 'RED';
        showBigMessage(teamText + " RECEIVES", pColor, () => {
            if (timeExpired) { handleTimeExpired(); return; }
            gameState = 'KICKOFF_IN_AIR';
            fx('whistle');
            setTimeout(() => fx('kick'), 500);
        });
    }

    function setupPreSnap() {
        player.x = FIELD_WIDTH_YARDS / 2;
        player.y = Math.max(1, lineOfScrimmage - 4);
        player.speed = player.baseSpeed;
        player.vx = 0;
        player.vy = 0;
        kickedBall.active = false;
        hasCrossedLOS = false;
        isKickoffReturn = false;
        camFocusY = null;

        const pColor = possession === 'HOME' ? '#3b82f6' : '#ef4444';
        const wrColor = possession === 'HOME' ? '#93c5fd' : '#fca5a5';
        const teColor = possession === 'HOME' ? '#60a5fa' : '#f87171';
        const olColor = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';

        player.color = pColor;

        let numLinebackers = Math.min(6, 3 + Math.floor(difficultyLevel / 2));

        let numOL = 3 + numLinebackers;
        let spacing = 2.5;
        let maxOffset = ((numOL - 1) * spacing) / 2;

        wrs = [
            { active: true, x: FIELD_WIDTH_YARDS * 0.15, y: lineOfScrimmage, speed: player.speed * 1.05, color: wrColor, type: 'WR', isBlocking: false },
            { active: true, x: (FIELD_WIDTH_YARDS / 2) + maxOffset + 2.5, y: lineOfScrimmage, speed: player.speed * 1.0, color: teColor, type: 'TE', isBlocking: true, blockTimer: 60 },
            { active: true, x: FIELD_WIDTH_YARDS * 0.85, y: lineOfScrimmage, speed: player.speed * 1.08, color: wrColor, type: 'WR', isBlocking: false }
        ];

        oLinemen = [];
        for (let i = 0; i < numOL; i++) {
            oLinemen.push({
                x: (FIELD_WIDTH_YARDS / 2) - maxOffset + (i * spacing),
                y: lineOfScrimmage + 0.5,
                radius: 0.9,
                color: olColor
            });
        }

        rb = {
            active: true,
            x: (FIELD_WIDTH_YARDS / 2) + 3,
            y: player.y,
            speed: player.baseSpeed * 1.06,
            color: pColor
        };

        returners = [];
        cosmeticQB = null;
        passObj.active = false;
        passObj.targetWrIndex = -1;

        // Defense lines up before the snap so the defending player can pick and position a defender
        spawnDefenders();

        gameState = 'PRE_SNAP';
        updateHUD();
    }

    function snapBall() {
        if (gameState !== 'PRE_SNAP') return;
        fx('whistle');
        gameState = 'PLAYING';
    }

    function handoffBall() {
        if (gameState !== 'PLAYING' || hasCrossedLOS || !rb.active || isKickoffReturn || rb.y > lineOfScrimmage) return;

        fx('kick');
        cosmeticQB = { x: player.x, y: player.y };

        player.x = rb.x;
        player.y = rb.y;
        player.speed = player.baseSpeed * 1.06;

        rb.active = false;

        showBigMessage("HANDOFF!", "#ea580c", null, 800);
    }

    // targetIndex -1 throws to the most open receiver; 0-2 throws to that receiver (left WR, TE, right WR)
    function throwPass(targetIndex = -1) {
        if (isKickoffReturn) return;

        let activeWrs = wrs.filter(w => w.active && !w.isBlocking);
        if (gameState !== 'PLAYING' || hasCrossedLOS || activeWrs.length === 0) return;

        let mostOpenWrIndex = 0;
        if (targetIndex >= 0) {
            const chosen = wrs[targetIndex];
            if (!chosen || !chosen.active || chosen.isBlocking) return;
            mostOpenWrIndex = targetIndex;
        } else {
            let bestScore = -99999;
            for (let i = 0; i < wrs.length; i++) {
                let wr = wrs[i];
                if (!wr.active || wr.isBlocking) continue;

                let minDefDist = 999;
                for (let def of defenders) {
                    if (def.isCB || def.isSafety || def.human) {
                        let dist = Math.hypot(def.x - wr.x, def.y - wr.y);
                        if (dist < minDefDist) minDefDist = dist;
                    }
                }
                let throwDist = Math.hypot(wr.x - player.x, wr.y - player.y);
                let score = (minDefDist * 15) - throwDist;
                if (minDefDist < 2.5) score -= 500;

                if (score > bestScore) {
                    bestScore = score;
                    mostOpenWrIndex = i;
                }
            }
        }

        gameState = 'PASS_IN_AIR';
        fx('throw');

        passObj.targetWrIndex = mostOpenWrIndex;
        let targetWR = wrs[mostOpenWrIndex];
        targetWR.color = '#fef08a';

        passObj.active = true;
        passObj.x = player.x;
        passObj.y = player.y;
        passObj.startDist = Math.hypot(targetWR.x - player.x, targetWR.y - player.y);
    }

    function spawnDefenders() {
        defenders = [];
        let baseDefSpeed = player.baseSpeed * (0.85 + (difficultyLevel * 0.03));
        if (baseDefSpeed > player.baseSpeed * 1.02) baseDefSpeed = player.baseSpeed * 1.02;

        const defMain = possession === 'HOME' ? '#ef4444' : '#3b82f6';
        const defDark = possession === 'HOME' ? '#7f1d1d' : '#1e3a8a';
        const defSafety = possession === 'HOME' ? '#b91c1c' : '#1d4ed8';

        const dlOffsets = [-2.5, 0, 2.5];
        for (let offset of dlOffsets) {
            defenders.push({
                x: (FIELD_WIDTH_YARDS / 2) + offset,
                y: lineOfScrimmage + 1.5,
                radius: 0.9,
                speed: baseDefSpeed * 0.88,
                color: defDark,
                targetWrIndex: -1,
                isDL: true,
                engaged: false,
                isRBCover: false
            });
        }

        let numLinebackers = Math.min(6, 3 + Math.floor(difficultyLevel / 2));

        for (let i = 0; i < numLinebackers; i++) {
            let defX = (FIELD_WIDTH_YARDS / (numLinebackers + 1)) * (i + 1);
            let defY = lineOfScrimmage + 4 + (Math.random() * 5);

            let coversRB = (i === 0 && Math.random() < 0.8);

            defenders.push({
                x: defX, y: defY, radius: 0.85,
                speed: baseDefSpeed * (0.95 + Math.random() * 0.10),
                color: defMain, targetWrIndex: -1,
                isRBCover: coversRB
            });
        }

        defenders.push({
            x: FIELD_WIDTH_YARDS / 2,
            y: lineOfScrimmage + 6,
            radius: 0.85,
            speed: player.speed * 1.05,
            color: defMain,
            targetWrIndex: -1,
            isSpy: true,
            isRBCover: false
        });

        let blownCoverageIndex = Math.floor(Math.random() * wrs.length);
        wrs.forEach((w, index) => {
            let coverageMultiplier = (index === blownCoverageIndex)
                ? 0.50 + (Math.random() * 0.15)
                : 0.85 + (Math.random() * 0.08);

            defenders.push({
                x: w.x, y: lineOfScrimmage + 3, radius: 0.8, speed: w.speed * coverageMultiplier, color: defMain, targetWrIndex: index, isCB: true, isRBCover: false
            });
        });

        let safetyDepth = Math.min(105, lineOfScrimmage + 15 + (Math.random() * 4));
        let safetySpeed = player.speed * (0.92 + (difficultyLevel * 0.02));
        if (safetySpeed > player.speed * 1.06) safetySpeed = player.speed * 1.06;

        defenders.push({ x: FIELD_WIDTH_YARDS * 0.25, y: safetyDepth, radius: 0.8, speed: safetySpeed, color: defSafety, isSafety: true, isRBCover: false });
        defenders.push({ x: FIELD_WIDTH_YARDS * 0.75, y: safetyDepth, radius: 0.8, speed: safetySpeed, color: defSafety, isSafety: true, isRBCover: false });

        // The defending player starts as the middle linebacker (the spy)
        if (humanDefense()) setHumanDefender(defenders.findIndex(d => d.isSpy));
    }

    function setupFieldGoal(isPatAttempt = true) {
        isPAT = isPatAttempt;
        gameState = 'FIELD_GOAL_AIMING';
        player.x = FIELD_WIDTH_YARDS / 2;
        camFocusY = null;

        if (isPAT) {
            player.y = 85;
            hudState.dd = 'EXTRA POINT';
            hudState.yd = 'OPP 15';
            hudState.kb = 'KICK PAT';
        } else {
            player.y = Math.max(1, lineOfScrimmage - 7);
            hudState.dd = 'FIELD GOAL';
            let fgYard = Math.floor(player.y);
            hudState.yd = fgYard > 50 ? `OPP ${100-fgYard}` : `OWN ${fgYard}`;
            hudState.kb = 'KICK FG';
        }

        player.vx = 0; player.vy = 0;
        kickedBall.active = false;
        kickedBall.isBlocked = false;

        const pColor = possession === 'HOME' ? '#3b82f6' : '#ef4444';
        const olColor = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';
        const defMain = possession === 'HOME' ? '#ef4444' : '#3b82f6';
        player.color = pColor;

        let kickLOS = player.y + 7;
        oLinemen = [];
        defenders = [];
        for (let i = -4; i <= 4; i++) {
            if (i !== 0) oLinemen.push({x: (FIELD_WIDTH_YARDS/2) + i*1.5, y: kickLOS - 0.5, radius: 0.9, color: olColor});
            defenders.push({x: (FIELD_WIDTH_YARDS/2) + i*1.5, y: kickLOS + 1, radius: 0.85, speed: player.baseSpeed, color: defMain, targetWrIndex: -1, isDL: true, engaged: false, isCB: false, isSafety: false, isSpy: false, isRBCover: false});
        }
        oLinemen.push({x: FIELD_WIDTH_YARDS/2, y: kickLOS - 0.5, radius: 0.9, color: olColor});

        kickingMeter.pos = Math.random() * 100;
        kickingMeter.dir = Math.random() > 0.5 ? 1 : -1;
        kickingMeter.speed = Math.min(7, 2.0 + (difficultyLevel * 0.4));
    }

    function executeKick() {
        gameState = 'FIELD_GOAL_KICKED';
        kickedBall.active = true; kickedBall.x = player.x; kickedBall.y = player.y; kickedBall.size = 1;

        if (Math.random() < 0.05) {
            kickedBall.isBlocked = true;
            kickedBall.vy = -0.2;
            kickedBall.vx = (Math.random() - 0.5) * 0.4;
            fx('tackle');
            if (defenders.length > 0) {
                let hero = defenders[Math.floor(Math.random() * defenders.length)];
                hero.x = player.x + (Math.random() - 0.5) * 2;
                hero.y = player.y + 1;
            }
            showBigMessage("BLOCKED!", "#ef4444", () => {
                if (timeExpired && !isOvertime) { handleTimeExpired(); return; }
                if (isPAT) {
                    executeKickoff();
                } else {
                    let newLOS = 100 - player.y;
                    if (newLOS < 20) newLOS = 20;
                    if (newLOS > 99) newLOS = 99;
                    executeTurnover(newLOS);
                }
            });
        } else {
            kickedBall.isBlocked = false;
            fx('kick');
            kickedBall.vy = 0.5;
            kickedBall.vx = ((kickingMeter.pos - 50) / 50) * 0.3;
        }
    }

    function setupPunt() {
        gameState = 'PUNT_AIMING';
        player.x = FIELD_WIDTH_YARDS / 2;
        player.y = Math.max(1, lineOfScrimmage - 5);
        player.vx = 0; player.vy = 0;
        kickedBall.active = false;
        kickedBall.isBlocked = false;
        camFocusY = null;

        const pColor = possession === 'HOME' ? '#3b82f6' : '#ef4444';
        const olColor = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';
        const defMain = possession === 'HOME' ? '#ef4444' : '#3b82f6';
        player.color = pColor;

        let kickLOS = player.y + 5;
        oLinemen = [];
        defenders = [];
        for (let i = -3; i <= 3; i++) {
            if (i !== 0) oLinemen.push({x: (FIELD_WIDTH_YARDS/2) + i*2.5, y: kickLOS - 0.5, radius: 0.9, color: olColor});
            defenders.push({x: (FIELD_WIDTH_YARDS/2) + i*2.5, y: kickLOS + 1, radius: 0.85, speed: player.baseSpeed, color: defMain, targetWrIndex: -1, isDL: true, engaged: false, isCB: false, isSafety: false, isSpy: false, isRBCover: false});
        }
        oLinemen.push({x: FIELD_WIDTH_YARDS/2, y: kickLOS - 0.5, radius: 0.9, color: olColor});

        kickingMeter.pos = Math.random() * 100;
        kickingMeter.dir = Math.random() > 0.5 ? 1 : -1;
        kickingMeter.speed = Math.min(8, 2.5 + (difficultyLevel * 0.5));

        hudState.dd = '4TH DOWN PUNT';
    }

    function executePunt() {
        gameState = 'PUNT_KICKED';
        kickedBall.active = true; kickedBall.x = player.x; kickedBall.y = player.y;
        kickedBall.size = 1; kickedBall.timer = 0;

        if (Math.random() < 0.05) {
            kickedBall.isBlocked = true;
            kickedBall.vy = -0.2;
            kickedBall.vx = (Math.random() - 0.5) * 0.4;
            fx('tackle');
            if (defenders.length > 0) {
                let hero = defenders[Math.floor(Math.random() * defenders.length)];
                hero.x = player.x + (Math.random() - 0.5) * 2;
                hero.y = player.y + 1;
            }
            showBigMessage("BLOCKED!", "#ef4444", () => {
                if (timeExpired) { handleTimeExpired(); return; }
                let newLOS = 100 - player.y;
                if (newLOS < 1) newLOS = 1;
                if (newLOS > 99) newLOS = 99;
                executeTurnover(newLOS);
            });
        } else {
            kickedBall.isBlocked = false;
            fx('kick');
            kickedBall.vy = 0.65;
            kickedBall.vx = ((kickingMeter.pos - 50) / 50) * 0.5;
        }
    }

    function setupPuntReturn(catchY, catchX) {
        possession = possession === 'HOME' ? 'AWAY' : 'HOME';
        isKickoffReturn = true;
        hasCrossedLOS = false;
        isTwoPointConversion = false;

        const pColor = possession === 'HOME' ? '#3b82f6' : '#ef4444';
        const olColor = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';

        player.x = catchX;
        player.y = catchY;

        for(let i=0; i<11; i++) {
            defenders.push({
                x: (FIELD_WIDTH_YARDS / 12) * (i + 1),

                speed: player.baseSpeed * (0.95 + Math.random()*0.15),
                color: defMain,
                targetWrIndex: -1,
                isDL: false, isCB: false, isSafety: false, isSpy: false, isRBCover: false
            });

        if (humanDefense()) setHumanDefender(nearestDefenderIndex(catchX, catchY));

        oLinemen = [];
        for(let i=0; i<6; i++) {

            });

        returners = []; wrs = []; rb.active = false; cosmeticQB = null; passObj.active = false;
        kickedBall.active = false;

        updateHUD();
        camFocusY = null;
        camCut++;

        showBigMessage("PUNT RETURN!", pColor, () => {
            if (timeExpired) { handleTimeExpired(); return; }
            gameState = 'PLAYING';
            fx('whistle');
        });
    }

    function setupInterceptionReturn(catchY, catchX) {

        possession = possession === 'HOME' ? 'AWAY' : 'HOME';
        isKickoffReturn = true;
        hasCrossedLOS = false;
        isTwoPointConversion = false;

        const pColor = possession === 'HOME' ? '#3b82f6' : '#ef4444';
        const olColor = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';
        const defMain = possession === 'HOME' ? '#ef4444' : '#3b82f6';
