    function handleInterception(interceptX, interceptY) {
        gameState = 'ANIMATING';

        if (isTwoPointConversion) {
            fx('fail');
            isTwoPointConversion = false;
            showBigMessage("INTERCEPTED!", "#ef4444", () => {
                if (timeExpired) { handleTimeExpired(); return; }
                executeKickoff();
            });
            return;
        }

        let newY = 100 - interceptY;
        let newX = FIELD_WIDTH_YARDS - interceptX;

        if (newY < 1) newY = 20;
        if (newY > 99) newY = 99;

        setupInterceptionReturn(newY, newX);
    }

    function handleKickResult(isGood) {
        gameState = 'ANIMATING';
        if (isGood) {
            fx('success');
            let points = isPAT ? 1 : 3;
            if (possession === 'HOME') scoreHome += points; else scoreAway += points;
            updateHUD();
            showBigMessage("IT'S GOOD!", '#34d399', () => {
                if (isOvertime) { endGame("SUDDEN DEATH!"); return; }
                if (timeExpired) { handleTimeExpired(); return; }
                executeKickoff();
            });
        } else {
            fx('fail');
            showBigMessage("NO GOOD!", '#ef4444', () => {
                if (timeExpired && !isOvertime) { handleTimeExpired(); return; }
                if (isPAT) {
                    executeKickoff();
                } else {
                    let newLOS = 100 - player.y;
                    if (newLOS < 20) newLOS = 20;
                    if (newLOS > 99) newLOS = 99;
                    executeTurnover(newLOS);
                }
            });
        }
    }

    function update() {
        for (let def of defenders) def.targetedByBlocker = false;

        if (gameState === 'PRE_SNAP') {
            // The defending player can reposition their defender, but not across the line
            moveHumanDefender(1, lineOfScrimmage + 1);
            return;
        }

        if (gameState === 'FIELD_GOAL_AIMING' || gameState === 'PUNT_AIMING') {
            kickingMeter.pos += kickingMeter.speed * kickingMeter.dir;
            if (kickingMeter.pos >= 100) { kickingMeter.pos = 100; kickingMeter.dir = -1; }
            if (kickingMeter.pos <= 0) { kickingMeter.pos = 0; kickingMeter.dir = 1; }
            return;
        }

        if (gameState === 'KICKOFF_IN_AIR') {
            kickedBall.timer++;
            let t = kickedBall.timer / 100;
            if (t > 1) t = 1;

            kickedBall.x = kickedBall.startX + (kickoffTargetX - kickedBall.startX) * t;
            kickedBall.y = kickedBall.startY + (kickoffTargetY - kickedBall.startY) * t;
            kickedBall.size = 1 + Math.sin(t * Math.PI) * 2;

            for(let def of defenders) {
                if (def.human && moveHumanDefender(1.4)) continue;
                def.y -= def.speed * 1.4;
            }

            for(let r of returners) {
                let dx = kickoffTargetX - r.x;
                let dy = kickoffTargetY - r.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 0.5) {
                    r.x += (dx/dist) * r.speed;
                    r.y += (dy/dist) * r.speed;
                }
            }

            camFocusY = kickedBall.y;

            if (kickedBall.timer >= 100) {
                fx('kick');

                let d1 = Math.hypot(returners[0].x - kickoffTargetX, returners[0].y - kickoffTargetY);
                let d2 = Math.hypot(returners[1].x - kickoffTargetX, returners[1].y - kickoffTargetY);

                let catcher = d1 < d2 ? returners[0] : returners[1];
                let blocker = d1 < d2 ? returners[1] : returners[0];

                player.x = catcher.x;
                player.y = catcher.y;
                player.vx = 0; player.vy = 0;
                player.speed = player.baseSpeed * 1.20;

                oLinemen.push({x: blocker.x, y: blocker.y, radius: 0.9, color: player.color});
                returners = [];

                kickedBall.active = false;
                camFocusY = null;
                gameState = 'PLAYING';
            }
            return;
        }

        if (gameState === 'PUNT_KICKED') {
            kickedBall.x += kickedBall.vx; kickedBall.y += kickedBall.vy;
            camFocusY = kickedBall.y;

            if (kickedBall.isBlocked) {
                kickedBall.size = Math.max(0.4, kickedBall.size - 0.02);
                return;
            }

            kickedBall.timer++;
            kickedBall.size = 1 - Math.sin((kickedBall.timer / 80) * Math.PI) * 0.5;

            if (kickedBall.x < 0 || kickedBall.x > FIELD_WIDTH_YARDS || kickedBall.timer >= 80) {
                gameState = 'ANIMATING';
                fx('whistle');

                let puntDist = kickedBall.timer * 0.65;
                let landY = player.y + puntDist;
                let newLOS = 100 - landY;

                if (kickedBall.x < 0 || kickedBall.x > FIELD_WIDTH_YARDS) {
                    showBigMessage("OUT OF BOUNDS!", '#fbbf24', () => {
                        if (timeExpired) { handleTimeExpired(); return; }
                        if (newLOS < 1) newLOS = 20;
                        executeTurnover(newLOS);
                    });
                } else if (newLOS < 1) {
                    showBigMessage("TOUCHBACK!", '#fbbf24', () => {
                        if (timeExpired) { handleTimeExpired(); return; }
                        executeTurnover(20);
                    });
                } else {
                    let catchX = FIELD_WIDTH_YARDS - kickedBall.x;
                    showBigMessage("PUNT CAUGHT!", '#3b82f6', () => {
                        if (timeExpired) { handleTimeExpired(); return; }
                        setupPuntReturn(newLOS, catchX);
                    });
                }
            }
            return;
        }

        if (gameState === 'FIELD_GOAL_KICKED') {
            kickedBall.x += kickedBall.vx; kickedBall.y += kickedBall.vy;
            camFocusY = kickedBall.y;

            if (kickedBall.isBlocked) {
                kickedBall.size = Math.max(0.4, kickedBall.size - 0.02);
                return;
            }

            kickedBall.size -= 0.003; if (kickedBall.size < 0.4) kickedBall.size = 0.4;
            if (kickedBall.y >= 110) {
                if (kickedBall.x > 23.57 && kickedBall.x < 29.73) handleKickResult(true);
                else handleKickResult(false);
            }
            return;
        }

        if (gameState === 'PLAYING' || gameState === 'PASS_IN_AIR') {

            if (rb.active) {
                if (rb.y < lineOfScrimmage + 1.5) {
                    rb.x += 0.05; rb.y += rb.speed * 0.4;
                } else {
                    rb.x += 0.01;
                }
                rb.x = Math.max(1, Math.min(FIELD_WIDTH_YARDS - 1, rb.x));
            }

            for (let w of wrs) {
                if (!w.active) continue;
                if (w.type === 'TE' && w.blockTimer > 0) {
                    w.blockTimer--; w.isBlocking = true;
                    let nearestDef = null; let minDist = 999;

                    for (let def of defenders) {
                        if (isBlockable(def, w) && !def.targetedByBlocker) {
                            let d = Math.hypot(def.x - w.x, def.y - w.y);
                            if (d < minDist) { minDist = d; nearestDef = def; }
                        }
                    }
                    if (!nearestDef) {
                        minDist = 999;
                        for (let def of defenders) {
                            if (isBlockable(def, w)) {
                                let d = Math.hypot(def.x - w.x, def.y - w.y);
                                if (d < minDist) { minDist = d; nearestDef = def; }
                            }
                        }
                    }
                    if (nearestDef) {
                        nearestDef.targetedByBlocker = true;
                        if (minDist > 1.2 && minDist < 3.0) {
                            w.x += (nearestDef.x - w.x) * 0.1; w.y += (nearestDef.y - w.y) * 0.1;
                        } else if (minDist <= 1.2) nearestDef.engaged = true;
                    }
                } else {
                    w.isBlocking = false; w.y += w.speed;
                }
                w.x = Math.max(1, Math.min(FIELD_WIDTH_YARDS - 1, w.x));
                w.y = Math.min(108, w.y);
            }
        }

        if (gameState === 'PASS_IN_AIR') {
            let targetWR = wrs[passObj.targetWrIndex];
            const dx = targetWR.x - passObj.x; const dy = targetWR.y - passObj.y;
            const dist = Math.hypot(dx, dy); const passSpeed = player.speed * 5;

            for (let def of defenders) {
                if (def.human) { moveHumanDefender(); continue; }
                let dxDef = targetWR.x - def.x; let dyDef = targetWR.y - def.y;
                let distDef = Math.hypot(dxDef, dyDef);
                if (distDef > 0) {
                    def.x += (dxDef / distDef) * (def.speed * 0.6);
                    def.y += (dyDef / distDef) * (def.speed * 0.6);
                }
            }

            if (dist < passSpeed) {
                let brokenUp = false;
                let interceptorDef = null;
                for (let def of defenders) {
                    if (def.isCB || def.isSafety || def.human) {
                        // A human defender gets a bigger break-up window and a better shot at the pick
                        let reach = def.human ? 1.0 : def.radius - 0.2;
                        if (Math.hypot(def.x - targetWR.x, def.y - targetWR.y) < reach) {
                            brokenUp = true;
                            if (Math.random() < (def.human ? 0.25 : 0.10)) interceptorDef = def;
                            break;
                        }
                    }
                }
                if (brokenUp) {
                    if (interceptorDef) {
                        handleInterception(interceptorDef.x, interceptorDef.y);
                    } else {
                        handleIncompletePass("PASS BROKEN UP!");
                    }
                    return;
                }

                fx('kick');
                cosmeticQB = { x: player.x, y: player.y };
                player.x = targetWR.x; player.y = targetWR.y;
                player.vx = 0; player.vy = targetWR.speed;
                for (let w of wrs) w.active = false;
                passObj.active = false; gameState = 'PLAYING';
                camFocusY = null;

                for (let def of defenders) { def.targetWrIndex = -1; def.isCB = false; }
            } else {
                passObj.x += (dx / dist) * passSpeed; passObj.y += (dy / dist) * passSpeed;
                const progress = 1 - (dist / passObj.startDist);
                passObj.size = 1 + Math.sin(progress * Math.PI) * 1.5;

                if (passObj.size < 1.2 && dist > 2.0) {
                    for (let def of defenders) {
                        if (Math.hypot(def.x - passObj.x, def.y - passObj.y) < def.radius * 0.7) {
                            if (def.isCB || def.isSafety || def.human) {
                                if (Math.random() < (def.human ? 0.30 : 0.10)) {
                                    handleInterception(def.x, def.y);
                                } else {
                                    handleIncompletePass("PASS DEFLECTED!");
                                }
                                return;
                            } else {
                                handleInterception(def.x, def.y);
                                return;
                            }
                        }
                    }
                }
                if (passObj.y > 110) { handleIncompletePass("INCOMPLETE"); return; }
                camFocusY = passObj.y;
            }
            return;
        }

        if (gameState !== 'PLAYING') return;

        // Ball carrier movement from whoever is on offense
        const inp = offenseInput();
        player.vx = inp.mx * player.speed; player.vy = inp.my * player.speed;
        player.x += player.vx; player.y += player.vy;
        player.x = Math.max(player.radius, Math.min(FIELD_WIDTH_YARDS - player.radius, player.x));
        player.y = Math.max(0, player.y);

        // Instant Touchdown check! (Breaking the plane or catching in the endzone!)
        if (player.y >= 100) { handleTouchdown(); return; }

        if (player.y > lineOfScrimmage + 0.5 && !hasCrossedLOS) {
            hasCrossedLOS = true;
        }

        // Blocker Logic
        for (let ol of oLinemen) {
            let nearestRusher = null; let minDist = 999;
            for (let def of defenders) {
                if (isBlockable(def, ol) && !def.targetedByBlocker) {
                    let d = Math.hypot(def.x - ol.x, def.y - ol.y);
                    if (d < minDist) { minDist = d; nearestRusher = def; }
                }
            }
            if (!nearestRusher) {
                minDist = 999;
                for (let def of defenders) {
                    if (isBlockable(def, ol)) {
                        let d = Math.hypot(def.x - ol.x, def.y - ol.y);
                        if (d < minDist) { minDist = d; nearestRusher = def; }
                    }
                }
            }

            if (nearestRusher) {
                nearestRusher.targetedByBlocker = true;
                if (minDist > 1.2) {
                    ol.x += (nearestRusher.x - ol.x) * 0.15;
                    ol.y += (nearestRusher.y - ol.y) * 0.15;
                } else nearestRusher.engaged = true;
            }
        }

        // Defender AI Logic
        for (let def of defenders) {
            if (def.stunTimer > 0) {
                def.stunTimer--;
                continue;
            }

            let currentSpeed = def.speed;
            if (def.engaged) {
                currentSpeed *= 0.20;
                let shedChance = isKickoffReturn ? 0.15 : 0.075;
                if (Math.random() < shedChance) def.engaged = false;
            }

            if (def.human) {
                moveHumanDefender(1, null, true);
                const reach = Math.hypot(player.x - def.x, player.y - def.y);
                if (reach < (player.radius + def.radius) * 0.95) {
                    // A human tackler is much surer than the AI, but the runner can still slip one
                    if (Math.random() < 0.15) {
                        def.stunTimer = 45;
                        def.x += (def.x - player.x) * 2; def.y += (def.y - player.y) * 2;
                        fx('juke');
                    } else {
                        if (Math.random() < 0.15) handleFumble(); else handleTackle();
                        return;
                    }
                }
                continue;
            }

            if (def.isRBCover && rb.active && !hasCrossedLOS) {
                def.x += (rb.x - def.x) * 0.15;
                def.y += ((rb.y + 1.5) - def.y) * 0.15;
                if (Math.hypot(rb.x - def.x, rb.y - def.y) < 2.0) def.x += (Math.random() - 0.5) * 0.1;
                continue;
            }

            if (def.isSpy) {
                let isOutsidePocket = Math.abs(player.x - (FIELD_WIDTH_YARDS / 2)) > 8;
                if (!hasCrossedLOS && !isOutsidePocket) {
                    let targetX = player.x; let targetY = lineOfScrimmage + 6;
                    const dx = targetX - def.x; const dy = targetY - def.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) { def.x += (dx / dist) * currentSpeed; def.y += (dy / dist) * currentSpeed; }
                    continue;
                }
            }

            if (def.isCB && def.targetWrIndex !== -1 && wrs[def.targetWrIndex] && wrs[def.targetWrIndex].active) {
                let assignedWR = wrs[def.targetWrIndex];
                if (assignedWR.isBlocking) {
                    def.x += (assignedWR.x - def.x) * 0.1; def.y += (assignedWR.y + 4 - def.y) * 0.1;
                } else {
                    def.x += (assignedWR.x - def.x) * 0.15; def.y += def.speed;
                    if (Math.hypot(assignedWR.x - def.x, assignedWR.y - def.y) < 1.0) def.x += (Math.random() - 0.5) * 0.2;
                }
                continue;
            }

            let targetX = player.x; let targetY = player.y;
            let targetVx = player.vx; let targetVy = player.vy;

            if (def.isSafety) {
                if (!hasCrossedLOS) {
                    let deepestY = lineOfScrimmage; let threatX = def.x;
                    for (let w of wrs) {
                        if (w.active) {
                            let isLeftSafety = def.x < FIELD_WIDTH_YARDS / 2;
                            let isLeftWR = w.x < FIELD_WIDTH_YARDS / 2;
                            if (isLeftSafety === isLeftWR && w.y > deepestY) { deepestY = w.y; threatX = w.x; }
                        }
                    }
                    targetX = threatX; targetY = Math.min(108, deepestY + 10); targetVx = 0; targetVy = 0;
                } else {
                    const distToTarget = Math.hypot(targetX - def.x, targetY - def.y);
                    const lookAhead = Math.min(25, distToTarget * 2);
                    targetX += targetVx * lookAhead; targetY += targetVy * lookAhead;
                }
            }

            const dx = targetX - def.x; const dy = targetY - def.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 0) { def.x += (dx / dist) * currentSpeed; def.y += (dy / dist) * currentSpeed; }

            const actualDist = Math.hypot(player.x - def.x, player.y - def.y);
            if (actualDist < (player.radius + def.radius) * 0.95) {
                let evasionRoll = Math.random();
                if (evasionRoll < 0.25) {
                    def.stunTimer = 60;
                    def.x += (def.x - player.x) * 2; def.y += (def.y - player.y) * 2;
                    fx('juke');
                    continue;
                } else if (evasionRoll < 0.50) {
                    def.stunTimer = 45; fx('stiffArm'); continue;
                } else {
                    if (Math.random() < 0.15) handleFumble(); else handleTackle();
                    return;
                }
            }
        }
    }

    function handleIncompletePass(msg) {
        gameState = 'ANIMATING';
        fx('fail');
        showBigMessage(msg, "#fbbf24", () => {
            if (timeExpired) { handleTimeExpired(); return; }
            if (isTwoPointConversion) {
                isTwoPointConversion = false;
                showBigMessage("CONVERSION FAILED!", "#ef4444", () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    executeKickoff();
                });
                return;
            }
            down++;
            if (down === 4) {
                let distance = Math.ceil(firstDownLine - lineOfScrimmage);
                if (lineOfScrimmage >= 50) showBigMessage("4TH DOWN - FIELD GOAL", "#fbbf24", () => { if(timeExpired){handleTimeExpired();return;} setupFieldGoal(false);});
                else if (distance >= 5) showBigMessage("4TH DOWN - PUNTING", "#fbbf24", () => { if(timeExpired){handleTimeExpired();return;} setupPunt();});
                else showBigMessage("4TH DOWN - GOING FOR IT!", "#fbbf24", () => { if(timeExpired){handleTimeExpired();return;} setupPreSnap();});
            } else if (down > 4) {
                showBigMessage('TURNOVER ON DOWNS', '#ef4444', () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    let newLOS = 100 - lineOfScrimmage;
                    if(newLOS > 99) newLOS = 99;
                    executeTurnover(newLOS);
                });
            } else { setupPreSnap(); }
        });
    }

    function handleFumble() {
        gameState = 'ANIMATING';
        fx('tackle');
        setTimeout(() => fx('fail'), 400);

        let forwardProgress = Math.max(lineOfScrimmage, player.y);

        if (isKickoffReturn) {
            isKickoffReturn = false;
            forwardProgress = player.y;
            if (forwardProgress < 1) forwardProgress = 20;
        } else if (player.y < lineOfScrimmage) {
            forwardProgress = Math.max(1, player.y);
        }

        lineOfScrimmage = forwardProgress;

        if (isTwoPointConversion) {
            isTwoPointConversion = false;
            showBigMessage('FUMBLE!', '#ef4444', () => {
                if (timeExpired) { handleTimeExpired(); return; }
                executeKickoff();
            });
            return;
        }

        showBigMessage('FUMBLE!', '#ef4444', () => {
            if (timeExpired) { handleTimeExpired(); return; }
            let newLOS = 100 - lineOfScrimmage;
            if (newLOS > 99) newLOS = 99;
            if (newLOS < 1) newLOS = 20;
            executeTurnover(newLOS);
        });
    }

    function handleTackle() {
        gameState = 'ANIMATING';
        fx('tackle');

        let forwardProgress = Math.max(lineOfScrimmage, player.y);

        if (isKickoffReturn) {
            isKickoffReturn = false;
            forwardProgress = player.y;
            if (forwardProgress < 1) forwardProgress = 20;

            lineOfScrimmage = forwardProgress;
            down = 1;
            firstDownLine = lineOfScrimmage + 10;
            showBigMessage('TACKLED!', '#fbbf24', () => {
                if (timeExpired) { handleTimeExpired(); return; }
                setupPreSnap();
            });
            return;
        }

        if (player.y < lineOfScrimmage) forwardProgress = Math.max(1, player.y);

        const yardsGained = forwardProgress - lineOfScrimmage;
        lineOfScrimmage = forwardProgress;

        if (isTwoPointConversion) {
            isTwoPointConversion = false;
            setTimeout(() => fx('fail'), 400);
            showBigMessage('CONVERSION FAILED!', '#ef4444', () => {
                if (timeExpired) { handleTimeExpired(); return; }
                executeKickoff();
            });
            return;
        }

        if (lineOfScrimmage >= firstDownLine) {
            setTimeout(() => fx('success'), 400);
            down = 1; firstDownLine = lineOfScrimmage + 10;
            showBigMessage('FIRST DOWN!', '#34d399', () => {
                if (timeExpired) { handleTimeExpired(); return; }
                setupPreSnap();
            });
        } else {
            down++;
            if (down === 4) {
                let distance = Math.ceil(firstDownLine - lineOfScrimmage);
                if (lineOfScrimmage >= 50) showBigMessage('TACKLED!', '#fbbf24', () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    showBigMessage('4TH DOWN - FIELD GOAL', '#fbbf24', () => setupFieldGoal(false));
                });
                else if (distance >= 5) showBigMessage('TACKLED!', '#fbbf24', () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    showBigMessage('4TH DOWN - PUNTING', '#fbbf24', () => setupPunt());
                });
                else showBigMessage('TACKLED!', '#fbbf24', () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    showBigMessage('4TH DOWN - GOING FOR IT!', '#fbbf24', () => setupPreSnap());
                });
            } else if (down > 4) {
                setTimeout(() => fx('fail'), 400);
                showBigMessage('TURNOVER ON DOWNS', '#ef4444', () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    let newLOS = 100 - lineOfScrimmage;
                    if(newLOS > 99) newLOS = 99;
                    executeTurnover(newLOS);
                });
            } else {
                showBigMessage('TACKLED!', '#fbbf24', () => {
                    if (timeExpired) { handleTimeExpired(); return; }
                    setupPreSnap();
                });
            }
        }
    }

    function handleTouchdown() {
        gameState = 'ANIMATING';
        fx('touchdown');
        isKickoffReturn = false;

        if (isTwoPointConversion) {
            if (possession === 'HOME') scoreHome += 2; else scoreAway += 2;
            updateHUD();
            showBigMessage('2-PT GOOD!', '#34d399', () => {
                if (isOvertime) { endGame("SUDDEN DEATH!"); return; }
                if (timeExpired) { handleTimeExpired(); return; }
                isTwoPointConversion = false;
                executeKickoff();
            });
            return;
        }

        if (possession === 'HOME') scoreHome += 6; else scoreAway += 6;
        difficultyLevel++;
        updateHUD();

        // Sudden Death OT ends immediately on a Touchdown!
        if (isOvertime) {
            showBigMessage('TOUCHDOWN!', possession === 'HOME' ? '#60a5fa' : '#f87171', () => {
                endGame("SUDDEN DEATH!");
            });
            return;
        }

        let myScore = possession === 'HOME' ? scoreHome : scoreAway;
        let oppScore = possession === 'HOME' ? scoreAway : scoreHome;
        let diff = oppScore - myScore;

        let goingForTwo = (gameTimeRemaining <= 60 && diff >= 2);

        showBigMessage('TOUCHDOWN!', possession === 'HOME' ? '#60a5fa' : '#f87171', () => {
            if (timeExpired) { handleTimeExpired(); return; }

            if (goingForTwo) {
                showBigMessage('GOING FOR 2!', '#fbbf24', () => {
                    setupTwoPointConversion();
                });
            } else {
                setupFieldGoal(true);
            }
        });
    }

    function setupTwoPointConversion() {
        isTwoPointConversion = true;
        lineOfScrimmage = 98;
        down = 1;
        firstDownLine = 100;
        setupPreSnap();
    }

    let msgHideTimer = null;
    function showBigMessage(text, color, callback, delay = 1500) {
        displayBigMessage(text, color, delay);
        emit({ k: 'msg', text, color, delay });
        const gen = gameGen;
        setTimeout(() => { if (callback && gen === gameGen) callback(); }, delay);
    }

    function displayBigMessage(text, color, delay) {
        bigMessage.innerText = text;
        bigMessage.style.color = color;
        overlayMessage.classList.remove('hidden');
        clearTimeout(msgHideTimer);
        msgHideTimer = setTimeout(() => overlayMessage.classList.add('hidden'), delay);
    }

    function updateHUD() {
        hudState.sh = scoreHome;
        hudState.sa = scoreAway;
        hudState.pd = possession;

        if (gameState === 'FIELD_GOAL_AIMING' || gameState === 'FIELD_GOAL_KICKED' || gameState === 'PUNT_AIMING' || gameState === 'PUNT_KICKED') return;

        if (isKickoffReturn) {
            hudState.dd = `RETURN`;
            hudState.yd = `RECEIVING`;
            return;
        }

        if (isTwoPointConversion) {
            hudState.dd = `2-PT CONVERSION`;
            hudState.yd = `OPP 2`;
            return;
        }

        let downSuffix = 'TH';
        if (down === 1) downSuffix = 'ST';
        else if (down === 2) downSuffix = 'ND';
        else if (down === 3) downSuffix = 'RD';

        let distance = Math.ceil(firstDownLine - lineOfScrimmage);
        let distText = distance;
        if (firstDownLine >= 100) distText = 'GOAL';
        else if (distance <= 0) distText = 'INCHES';

        hudState.dd = `${down}${downSuffix} & ${distText}`;

        let yardText = '';
        let currentYardInt = Math.floor(lineOfScrimmage);
        if (currentYardInt === 50) yardText = '50';
        else if (currentYardInt < 50) yardText = `OWN ${currentYardInt}`;
        else yardText = `OPP ${100 - currentYardInt}`;

        hudState.yd = yardText;
    }

    // --- SIMULATION LOOP (solo + host) ---

    function simStep() {
        if (gameState === 'MENU') return;

        // Run the clock during gameplay (Pause during animations so you don't lose time watching messages!)
        const isClockRunning = gameState !== 'GAME_OVER' && gameState !== 'ANIMATING';
        if (isClockRunning && !timeExpired) {
            gameTimeRemaining -= STEP_MS / 1000;
            if (gameTimeRemaining <= 0) {
                gameTimeRemaining = 0;
                timeExpired = true;
            }
        }
        if (gameState !== 'GAME_OVER') {
            let minutes = Math.floor(gameTimeRemaining / 60);
            let seconds = Math.floor(gameTimeRemaining % 60).toString().padStart(2, '0');
            hudState.clk = `${minutes}:${seconds}`;
        }

        // Catch edge-case if they are just standing completely still aiming or in pre-snap when time runs out
        if (timeExpired && (gameState === 'PRE_SNAP' || gameState === 'FIELD_GOAL_AIMING' || gameState === 'PUNT_AIMING')) {
            handleTimeExpired();
            return;
        }

        update();
    }

    // Fixed-step accumulator: driven by both rAF and a timer so the host keeps simulating in a background tab
    let simAcc = 0;
    let simLast = performance.now();
    let lastSnapshotSent = 0;
    function pumpSim() {
        if (net.role === 'guest') return;
        const now = performance.now();
        simAcc += Math.min(1000, now - simLast);
        simLast = now;
        while (simAcc >= STEP_MS) {
            simStep();
            simAcc -= STEP_MS;
        }
        if (net.role === 'host' && net.connected && gameState !== 'MENU' && now - lastSnapshotSent >= SNAPSHOT_MS) {
            lastSnapshotSent = now;
            send(makeSnapshot());
        }
    }
    setInterval(pumpSim, STEP_MS);

    // --- STATE SYNC (host -> guest) ---

    const r2 = (v) => Math.round(v * 100) / 100;

    function makeSnapshot() {
        return {
            type: 's',
            t: performance.now(),
            gs: gameState,
            pos: possession,
            los: r2(lineOfScrimmage),
            fdl: r2(firstDownLine),
            kr: isKickoffReturn ? 1 : 0,
            xl: hasCrossedLOS ? 1 : 0,
            cf: camFocusY === null ? null : r2(camFocusY),
            cc: camCut,
            p: [r2(player.x), r2(player.y), player.color],
            rb: rb.active ? [r2(rb.x), r2(rb.y), rb.color] : null,
            ret: returners.map(r => [r2(r.x), r2(r.y), r.color]),
            wr: wrs.map(w => [r2(w.x), r2(w.y), w.color, w.active ? 1 : 0, w.isBlocking ? 1 : 0]),
            ol: oLinemen.map(o => [r2(o.x), r2(o.y), o.color]),
            df: defenders.map(d => [r2(d.x), r2(d.y), d.color, d.radius, d.stunTimer > 0 ? 1 : 0, d.human ? 1 : 0]),
            cq: cosmeticQB ? [r2(cosmeticQB.x), r2(cosmeticQB.y)] : null,
            pa: passObj.active ? [r2(passObj.x), r2(passObj.y), r2(passObj.size)] : null,
            kb: kickedBall.active ? [r2(kickedBall.x), r2(kickedBall.y), r2(kickedBall.size)] : null,
            km: r2(kickingMeter.pos),
            hud: hudState
        };
    }

    // Host -> guest one-shot events (sounds, big messages, game over), replayed in sync with the snapshots
    function emit(e) {
        if (net.role === 'host' && net.connected) send({ type: 'ev', t: performance.now(), e });
    }

    const snapBuffer = [];
    const eventQueue = [];
    let hostClockOffset = null; // guest clock minus host clock (plus the fastest one-way latency seen)
    let guestHud = { ...hudState };

    function onSnapshot(s) {
        const offset = performance.now() - s.t;
        if (hostClockOffset === null || offset < hostClockOffset) hostClockOffset = offset;
        else hostClockOffset += (offset - hostClockOffset) * 0.002; // Drift slowly if the route gets slower
        snapBuffer.push(s);
        if (snapBuffer.length > 60) snapBuffer.shift();
    }

    // Blend a position between two snapshots, but jump instead of sliding across teleports
    function lerpPos(a, b, t) {
        if (b === undefined || b === null || Math.abs(b - a) > 3) return a;
        return a + (b - a) * t;
    }
    function lerpList(listA, listB, t, build) {
        const compatible = listB && listB.length === listA.length;
        return listA.map((e, i) => build(e, compatible ? listB[i] : null, t));
    }

    function applySnapshot(a, b, t) {
        gameState = a.gs;
        possession = a.pos;
        lineOfScrimmage = a.los;
        firstDownLine = a.fdl;
        isKickoffReturn = !!a.kr;
        hasCrossedLOS = !!a.xl;
        camCut = a.cc;
        camFocusY = a.cf === null ? null : lerpPos(a.cf, b && b.cf, t);

        player.x = lerpPos(a.p[0], b && b.p[0], t);
        player.y = lerpPos(a.p[1], b && b.p[1], t);
        player.color = a.p[2];

        rb.active = !!a.rb;
        if (a.rb) {
            rb.x = lerpPos(a.rb[0], b && b.rb && b.rb[0], t);
            rb.y = lerpPos(a.rb[1], b && b.rb && b.rb[1], t);
            rb.color = a.rb[2];
        }

        returners = lerpList(a.ret, b && b.ret, t, (e, f, t) => ({ x: lerpPos(e[0], f && f[0], t), y: lerpPos(e[1], f && f[1], t), color: e[2] }));
        wrs = lerpList(a.wr, b && b.wr, t, (e, f, t) => ({ x: lerpPos(e[0], f && f[0], t), y: lerpPos(e[1], f && f[1], t), color: e[2], active: !!e[3], isBlocking: !!e[4] }));
        oLinemen = lerpList(a.ol, b && b.ol, t, (e, f, t) => ({ x: lerpPos(e[0], f && f[0], t), y: lerpPos(e[1], f && f[1], t), color: e[2], radius: 0.9 }));
        defenders = lerpList(a.df, b && b.df, t, (e, f, t) => ({ x: lerpPos(e[0], f && f[0], t), y: lerpPos(e[1], f && f[1], t), color: e[2], radius: e[3], stunTimer: e[4], human: !!e[5] }));

        cosmeticQB = a.cq ? { x: a.cq[0], y: a.cq[1] } : null;

        passObj.active = !!a.pa;
        if (a.pa) {
            passObj.x = lerpPos(a.pa[0], b && b.pa && b.pa[0], t);
            passObj.y = lerpPos(a.pa[1], b && b.pa && b.pa[1], t);
            passObj.size = a.pa[2];
        }

        kickedBall.active = !!a.kb;
        if (a.kb) {
            kickedBall.x = lerpPos(a.kb[0], b && b.kb && b.kb[0], t);
            kickedBall.y = lerpPos(a.kb[1], b && b.kb && b.kb[1], t);
            kickedBall.size = a.kb[2];
        }

        kickingMeter.pos = b ? a.km + (b.km - a.km) * t : a.km;
        guestHud = a.hud;
    }

    function updateGuestView(now) {
        const renderTime = hostClockOffset === null ? Infinity : now - hostClockOffset - INTERP_MS;

        if (snapBuffer.length) {
            while (snapBuffer.length >= 2 && snapBuffer[1].t <= renderTime) snapBuffer.shift();
            const a = snapBuffer[0];
            const b = snapBuffer[1];
            let t = 0;
            if (b && renderTime > a.t) t = Math.min(1, (renderTime - a.t) / (b.t - a.t));
            applySnapshot(a, b, t);
        }

        while (eventQueue.length && eventQueue[0].t <= renderTime) runEvent(eventQueue.shift().e);
    }

    function runEvent(e) {
        if (!e) return;
        if (e.k === 'sfx' && SOUNDS.hasOwnProperty(e.n)) SOUNDS[e.n]();
        else if (e.k === 'msg') displayBigMessage(String(e.text), String(e.color), Number(e.delay) || 1500);
        else if (e.k === 'over') showGameOver(String(e.title), String(e.color), String(e.sub));
    }

    // --- NETWORKING (PeerJS / WebRTC) ---

    function randomCode() {
        const bytes = crypto.getRandomValues(new Uint8Array(5));
        return Array.from(bytes, b => CODE_CHARS[b % CODE_CHARS.length]).join('');
    }

    function send(msg) {
        if (!net.conn || !net.conn.open) return;
        try { net.conn.send(msg); } catch (err) { /* Channel closing; the close handler cleans up */ }
    }

    function peerAvailable() {
        if (typeof Peer !== 'undefined') return true;
        showHome('Online play could not load (PeerJS blocked?). You can still play solo.');
        return false;
    }

    function createRoom() {
        if (!peerAvailable()) return;
        closeNet();
        net.role = 'host';
        mySide = 'HOME';
        showLobby('Creating room…');
        openHostPeer();
    }

    function openHostPeer() {
        const code = randomCode();
        const peer = new Peer(PEER_PREFIX + code);
        net.peer = peer;

        peer.on('open', () => {
            if (net.peer !== peer) return;
            net.code = code;
            showLobby('Waiting for an opponent to join…');
        });
        peer.on('connection', (conn) => {
            if (net.peer !== peer) return;
            if (net.conn && net.conn.open) {
                conn.on('open', () => { conn.send({ type: 'full' }); setTimeout(() => conn.close(), 500); });
                return;
            }
            attachConn(conn);
        });
        peer.on('disconnected', () => {
            // Lost the signaling server; existing games keep running but new players can't find us
            if (net.peer === peer && !peer.destroyed) peer.reconnect();
        });
        peer.on('error', (err) => {
            if (net.peer !== peer) return;
            if (err.type === 'unavailable-id') { peer.destroy(); openHostPeer(); return; }
            if (net.connected) return;
            if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
                showLobby('Could not reach the matchmaking server. Check your connection and try again.');
            } else {
                showLobby(`Connection error (${err.type}). Try creating a new game.`);
            }
        });
    }

    function joinRoom(rawCode) {
        const code = String(rawCode || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{5}$/.test(code)) {
            showHome('Enter the 5-character room code from your friend.');
            return;
        }
        if (!peerAvailable()) return;
        closeNet();
        net.role = 'guest';
        mySide = 'AWAY';
        net.code = code;
        joinInput.value = code;
        showLobby(`Connecting to room ${code}…`);

        const peer = new Peer();
        net.peer = peer;
        peer.on('open', () => {
            if (net.peer !== peer) return;
            attachConn(peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' }));
        });
        peer.on('error', (err) => {
            if (net.peer !== peer || net.connected) return;
            if (err.type === 'peer-unavailable') leaveToHome(`Room ${code} not found. Check the code and try again.`);
            else leaveToHome(`Could not connect (${err.type}). Try again.`);
            joinInput.value = code;
        });
    }

    function attachConn(conn) {
        net.conn = conn;
        conn.on('open', () => {
            if (net.conn !== conn) return;
            net.lastRecv = performance.now();
            if (net.role === 'guest') send({ type: 'hello', v: 6 });
        });
        conn.on('data', (msg) => {
            if (net.conn !== conn || !msg || typeof msg !== 'object') return;
            net.lastRecv = performance.now();
            onMessage(msg);
        });
        conn.on('close', () => { if (net.conn === conn) onPeerLost(); });
        conn.on('error', () => { if (net.conn === conn) onPeerLost(); });
    }

    const VALID_ACTIONS = ['primary', 'snap', 'kick', 'punt', 'pass', 'handoff', 'switch'];

    function onMessage(msg) {
        switch (msg.type) {
            // Host side
            case 'hello':
                if (net.role !== 'host') return;
                net.connected = true;
                send({ type: 'welcome' });
                showLobby('RED has joined! Kick off when you are ready.');
                break;
            case 'in': {
                if (net.role !== 'host') return;
                let mx = Number.isFinite(msg.mx) ? msg.mx : 0;
                let my = Number.isFinite(msg.my) ? msg.my : 0;
                const len = Math.hypot(mx, my);
                if (len > 1) { mx /= len; my /= len; }
                remoteInput.mx = mx; remoteInput.my = my;
                break;
            }
            case 'act':
                if (net.role !== 'host' || !VALID_ACTIONS.includes(msg.a)) return;
                handleAction(other(mySide), msg.a, msg.arg);
                break;

            // Guest side
            case 'welcome':
                if (net.role !== 'guest') return;
                net.connected = true;
                showLobby('Connected! Waiting for BLUE to kick off…');
                break;
            case 'full':
                leaveToHome('That room already has two players.');
                break;
            case 'start':
                if (net.role !== 'guest') return;
                beginGuestGame();
                break;
            case 's':
                if (net.role === 'guest') onSnapshot(msg);
                break;
            case 'ev':
                if (net.role === 'guest') eventQueue.push(msg);
                break;

            // Both
            case 'ping':
                send({ type: 'pong', t: msg.t });
                break;
            case 'pong':
                net.rtt = performance.now() - msg.t;
                break;
        }
    }

    function beginGuestGame() {
        stopGame();
        hostClockOffset = null;
        overlayMenu.classList.add('hidden');
        hudEl.style.display = 'block';
    }

    function onPeerLost() {
        const wasRole = net.role;
        if (net.conn) { try { net.conn.close(); } catch (err) {} }
        net.conn = null;
        net.connected = false;
        net.rtt = null;
        remoteInput.mx = 0; remoteInput.my = 0;

        if (wasRole === 'host') {
            // Keep the room open so the opponent (or someone new) can rejoin with the same code
            stopGame();
            showLobby('Your opponent left. Waiting for someone to join…');
        } else if (wasRole === 'guest') {
            const code = net.code;
            leaveToHome('Lost connection to BLUE.');
            joinInput.value = code || '';
        }
    }

    function closeNet() {
        const { conn, peer } = net;
        net.conn = null;
        net.peer = null;
        net.code = null;
        net.connected = false;
        net.rtt = null;
        if (conn) { try { conn.close(); } catch (err) {} }
        if (peer) { try { peer.destroy(); } catch (err) {} }
        remoteInput.mx = 0; remoteInput.my = 0;
    }

    function leaveToHome(message) {
        stopGame();
        closeNet();
        net.role = 'solo';
        mySide = 'HOME';
        showHome(message);
    }

    // Heartbeat: measure ping and notice a silent disconnect faster than WebRTC does
    setInterval(() => {
        if (!net.conn || !net.conn.open) return;
        send({ type: 'ping', t: performance.now() });
        if (net.connected && performance.now() - net.lastRecv > 8000) onPeerLost();
    }, 1000);

    function shareUrl(code) {
        return `${location.href.split(/[?#]/)[0]}?join=${code}`;
    }

    function copyShareLink() {
        const text = shareLink.value;
        const done = () => { copyBtn.innerText = 'COPIED!'; setTimeout(() => { copyBtn.innerText = 'COPY LINK'; }, 1500); };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done, () => { shareLink.select(); });
        } else {
            shareLink.select();
            try { document.execCommand('copy'); done(); } catch (err) {}
        }
    }

    // --- MENUS ---

    function resetMenuTitle() {
        menuTitle.innerHTML = `BLITZ<span class="text-red-500"> BREAKER</span>`;
        menuTitle.style.color = '#fff';
    }

    function showPanel(name) {
        panelHome.classList.toggle('hidden', name !== 'home');
        panelLobby.classList.toggle('hidden', name !== 'lobby');
        overlayMenu.classList.remove('hidden');
    }

    function showHome(message) {
        resetMenuTitle();
        menuSubtitle.innerText = 'Head-to-head online football! Create a game, send your friend the code, and battle Blue vs Red.';
        homeStatus.innerText = message || '';
        showPanel('home');
    }

    function showLobby(status) {
        resetMenuTitle();
        const isHost = net.role === 'host';
        menuSubtitle.innerText = isHost
            ? 'You are BLUE. Share the code or link with your opponent.'
            : 'You are RED. Whoever has the ball plays offense; the other team plays defense.';
        roomBox.classList.toggle('hidden', !(isHost && net.code));
        if (isHost && net.code) {
            roomCodeEl.innerText = net.code;
            shareLink.value = shareUrl(net.code);
        }
        lobbyStatus.innerText = status || '';
        startBtn.innerText = 'KICK OFF';
        startBtn.classList.toggle('hidden', !(isHost && net.connected));
        leaveBtn.innerText = 'LEAVE';
        showPanel('lobby');
    }

    function showGameOver(title, color, subtitle) {
        hudEl.style.display = 'none';
        menuTitle.innerText = title;
        menuTitle.style.color = color;
        menuSubtitle.innerText = subtitle;
        roomBox.classList.add('hidden');
        startBtn.innerText = 'PLAY AGAIN';

        if (net.role === 'solo') {
            lobbyStatus.innerText = '';
            startBtn.classList.remove('hidden');
            leaveBtn.innerText = 'MAIN MENU';
        } else if (net.role === 'host') {
            lobbyStatus.innerText = net.connected ? '' : 'Your opponent left.';
            startBtn.classList.toggle('hidden', !net.connected);
            leaveBtn.innerText = 'LEAVE';
        } else {
            lobbyStatus.innerText = 'Waiting for BLUE to start a rematch…';
            startBtn.classList.add('hidden');
            leaveBtn.innerText = 'LEAVE';
        }
        showPanel('lobby');
    }

    // --- PER-FRAME UI SYNC ---

    const hudCache = {};
    function setText(el, key, value) {
        if (hudCache[key] === value) return;
        hudCache[key] = value;
        el.innerText = value;
    }

    function renderHUD(h) {
        setText(timerDisplay, 'clk', String(h.clk));
        setText(clockLabel, 'cl', String(h.cl));
        const sh = Number(h.sh) || 0; const sa = Number(h.sa) || 0;
        if (hudCache.score !== `${sh}-${sa}`) {
            hudCache.score = `${sh}-${sa}`;
            scoreDisplay.innerHTML = `<span class="team-blue">${sh}</span> - <span class="team-red">${sa}</span>`;
        }
        let possessionText = h.pd === 'HOME' ? 'BLUE BALL' : 'RED BALL';
        if (net.role !== 'solo' && h.pd === mySide) possessionText += ' (YOU)';
        setText(possessionDisplay, 'pd', possessionText);
        possessionDisplay.style.color = h.pd === 'HOME' ? '#60a5fa' : '#f87171';
        setText(downDisplay, 'dd', String(h.dd));
        setText(yardLineDisplay, 'yd', String(h.yd));
        setText(kickBtn, 'kb', String(h.kb));
    }

    function toggle(el, show) {
        if (el.classList.contains('hidden') === show) el.classList.toggle('hidden', !show);
    }

    function syncControls() {
        const inGame = isInGame();
        const online = net.role !== 'solo';
        const onOffense = inGame && (!online || possession === mySide);
        const onDefense = inGame && online && possession !== mySide;

        toggle(overlaySnap, onOffense && gameState === 'PRE_SNAP');
        toggle(overlayKick, onOffense && gameState === 'FIELD_GOAL_AIMING');
        toggle(overlayPunt, onOffense && gameState === 'PUNT_AIMING');

        const canThrowOrHand = onOffense && gameState === 'PLAYING' && !hasCrossedLOS && !isKickoffReturn && !cosmeticQB;
        toggle(passBtn, canThrowOrHand && wrs.some(w => w.active && !w.isBlocking));
        toggle(handoffBtn, canThrowOrHand && rb.active);
        toggle(switchBtn, onDefense && ['PRE_SNAP', 'PLAYING', 'PASS_IN_AIR', 'KICKOFF_IN_AIR'].includes(gameState));

        let banner = '';
        if (onDefense) {
            const offense = TEAM_NAME[possession];
            if (gameState === 'PRE_SNAP') banner = `${offense} IS LINING UP • POSITION YOUR DEFENDER`;
            else if (gameState === 'FIELD_GOAL_AIMING' || gameState === 'PUNT_AIMING') banner = `${offense} IS KICKING…`;
        }
        setText(statusBanner, 'banner', banner);
        toggle(statusBanner, banner !== '');

        let help = 'DRAG TO MOVE • ARROW KEYS TO RUN • SPACE TO PASS • E TO HANDOFF';
        if (online) {
            const me = TEAM_NAME[mySide];
            help = possession === mySide
                ? `YOU: ${me} OFFENSE • DRAG/ARROWS TO RUN • SPACE PASS • 1-3 PICK RECEIVER • E HANDOFF`
                : `YOU: ${me} DEFENSE • DRAG/ARROWS TO MOVE • Q/SPACE SWITCH DEFENDER`;
            if (net.rtt !== null) help += ` • ${Math.round(net.rtt)}MS`;
        }
        setText(instructionEl, 'help', help);
    }

    // --- DRAWING FUNCTIONS ---

    function getScreenY(yardLine) { return canvas.height - ((yardLine - cameraY) * ppy); }
    function getScreenX(fieldX) {
        const fieldPixelWidth = FIELD_WIDTH_YARDS * ppy;
        return ((canvas.width - fieldPixelWidth) / 2) + (fieldX * ppy);
    }

    let lastCamCut = -1;
    function updateCamera(dt) {
        const desiredScreenY = canvas.height * 0.75;
        const focusY = camFocusY !== null ? camFocusY : player.y;
        const targetCameraY = focusY - ((canvas.height - desiredScreenY) / ppy);

        if (camCut !== lastCamCut || gameState === 'PRE_SNAP' || gameState === 'PUNT_AIMING' || gameState === 'FIELD_GOAL_AIMING') {
            cameraY = targetCameraY;
            lastCamCut = camCut;
        } else if (gameState !== 'ANIMATING' && gameState !== 'MENU') {
            cameraY += (targetCameraY - cameraY) * (1 - Math.pow(0.9, dt * 60));
        }

        const visibleYards = canvas.height / ppy;
        if (cameraY < -15) cameraY = -15;
        if (cameraY + visibleYards > 115) cameraY = 115 - visibleYards;
    }

    function drawField() {
        ctx.fillStyle = '#166534'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const startYard = Math.floor(cameraY); const endYard = Math.ceil(cameraY + (canvas.height / ppy));
        const leftSideline = getScreenX(0); const rightSideline = getScreenX(FIELD_WIDTH_YARDS);

        ctx.fillStyle = '#064e3b';
        ctx.fillRect(0, 0, leftSideline, canvas.height); ctx.fillRect(rightSideline, 0, canvas.width - rightSideline, canvas.height);

        ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

        for (let y = startYard; y <= endYard; y++) {
            if (y < 0 || y > 100) continue;
            const screenY = getScreenY(y);
            if (y % 5 === 0) {
                ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(leftSideline, screenY); ctx.lineTo(rightSideline, screenY); ctx.stroke();
                if (y % 10 === 0 && y > 0 && y < 100) {
                    let displayNum = y > 50 ? 100 - y : y;
                    ctx.font = `bold ${ppy * 1.5}px 'Russo One', sans-serif`;
                    ctx.save(); ctx.translate(leftSideline + (ppy * 4), screenY); ctx.rotate(-Math.PI/2); ctx.fillText(displayNum, 0, 0); ctx.restore();
                    ctx.save(); ctx.translate(rightSideline - (ppy * 4), screenY); ctx.rotate(Math.PI/2); ctx.fillText(displayNum, 0, 0); ctx.restore();
                }
            } else {
                ctx.lineWidth = 1; const hashWidth = ppy * 0.5;
                const leftHash = getScreenX(FIELD_WIDTH_YARDS / 2 - 3); const rightHash = getScreenX(FIELD_WIDTH_YARDS / 2 + 3);
                ctx.beginPath();
                ctx.moveTo(leftHash - hashWidth, screenY); ctx.lineTo(leftHash + hashWidth, screenY);
                ctx.moveTo(rightHash - hashWidth, screenY); ctx.lineTo(rightHash + hashWidth, screenY); ctx.stroke();
            }
        }

        // Bottom Endzone (Own Endzone)
        if (cameraY <= 0) {
            const ezTop = getScreenY(0);
            const ezBottom = getScreenY(-10); // Endzone is 10 yards deep

            ctx.fillStyle = possession === 'HOME' ? '#1e3a8a' : '#7f1d1d';
            ctx.fillRect(leftSideline, ezTop, rightSideline - leftSideline, ezBottom - ezTop);

            // Draw turf behind the endzone padding
            if (ezBottom < canvas.height) {
                ctx.fillStyle = '#166534';
                ctx.fillRect(leftSideline, ezBottom, rightSideline - leftSideline, canvas.height - ezBottom);
            }

            ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = `bold ${ppy * 4}px 'Russo One', sans-serif`;
            let txt = possession === 'HOME' ? 'BLUE' : 'RED';
            ctx.fillText(txt, canvas.width/2, ezTop + (ppy*5));
        }

        // Top Endzone (Opponent Endzone)
        if (cameraY + (canvas.height/ppy) >= 100) {
            const ezBottom = getScreenY(100); const ezTop = getScreenY(110);
            ctx.fillStyle = possession === 'HOME' ? '#7f1d1d' : '#1e3a8a';
            ctx.fillRect(leftSideline, Math.max(0, ezTop), rightSideline - leftSideline, ezBottom - Math.max(0, ezTop));

            if (ezTop > 0) { ctx.fillStyle = '#166534'; ctx.fillRect(leftSideline, 0, rightSideline - leftSideline, ezTop); }
            if (ezBottom > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = `bold ${ppy * 4}px 'Russo One', sans-serif`;
                let txt = possession === 'HOME' ? 'RED' : 'BLUE';
                ctx.fillText(txt, canvas.width/2, ezBottom - (ppy*5));
            }
        }

        if (gameState === 'PLAYING' || gameState === 'PRE_SNAP' || gameState === 'ANIMATING') {
            if (!isKickoffReturn) {
                const losY = getScreenY(lineOfScrimmage);
                if (losY > 0 && losY < canvas.height) {
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(leftSideline, losY); ctx.lineTo(rightSideline, losY); ctx.stroke();
                }
                const fdY = getScreenY(firstDownLine);
                if (fdY > 0 && fdY < canvas.height && firstDownLine <= 100) {
                    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(leftSideline, fdY); ctx.lineTo(rightSideline, fdY); ctx.stroke();
                }
            }
        }

        // Goalposts
        if (cameraY > 50) {
            const postY = getScreenY(110);
            if (postY > -100 && postY < canvas.height + 100) {
                const leftX = getScreenX(23.57); const rightX = getScreenX(29.73);
                ctx.strokeStyle = '#eab308'; ctx.lineWidth = ppy * 0.4; ctx.lineCap = 'round';

                const centerX = getScreenX(FIELD_WIDTH_YARDS/2);
                ctx.beginPath(); ctx.moveTo(centerX, postY); ctx.lineTo(centerX, postY + ppy * 3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(leftX, postY); ctx.lineTo(rightX, postY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(leftX, postY); ctx.lineTo(leftX, postY - ppy * 8);
                ctx.moveTo(rightX, postY); ctx.lineTo(rightX, postY - ppy * 8); ctx.stroke();
            }
        }
    }

    function drawEntities() {
        if (gameState === 'MENU') return;

        if (cosmeticQB) {
            const cqScreenX = getScreenX(cosmeticQB.x); const cqScreenY = getScreenY(cosmeticQB.y); const pRadiusPx = player.radius * ppy;
            ctx.beginPath(); ctx.arc(cqScreenX, cqScreenY, pRadiusPx, 0, Math.PI * 2);
            ctx.fillStyle = player.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
        }

        // Draw Running Back
        if (rb.active) {
            const rbScreenX = getScreenX(rb.x); const rbScreenY = getScreenY(rb.y); const pRadiusPx = player.radius * ppy;
            ctx.beginPath(); ctx.arc(rbScreenX, rbScreenY, pRadiusPx, 0, Math.PI * 2);
            ctx.fillStyle = rb.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        }

        // Draw Kickoff Returners waiting for the ball
        for (let r of returners) {
            const rScreenX = getScreenX(r.x); const rScreenY = getScreenY(r.y); const pRadiusPx = player.radius * ppy;
            ctx.beginPath(); ctx.arc(rScreenX, rScreenY, pRadiusPx, 0, Math.PI * 2);
            ctx.fillStyle = r.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        }

        for (let w of wrs) {
            if (w.active) {
                const wrScreenX = getScreenX(w.x); const wrScreenY = getScreenY(w.y); const pRadiusPx = player.radius * ppy;
                ctx.beginPath(); ctx.arc(wrScreenX, wrScreenY, pRadiusPx, 0, Math.PI * 2);
                ctx.fillStyle = w.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
            }
        }

        for (let ol of oLinemen) {
            const olScreenX = getScreenX(ol.x); const olScreenY = getScreenY(ol.y); const olRadiusPx = ol.radius * ppy;
            ctx.beginPath(); ctx.arc(olScreenX, olScreenY, olRadiusPx, 0, Math.PI * 2);
            ctx.fillStyle = ol.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
        }

        // Do not draw the active player if the ball is still in the air during kickoff
        if (gameState !== 'KICKOFF_IN_AIR') {
            const pScreenX = getScreenX(player.x); const pScreenY = getScreenY(player.y); const pRadiusPx = player.radius * ppy;

            ctx.beginPath(); ctx.arc(pScreenX, pScreenY, pRadiusPx, 0, Math.PI * 2);
            ctx.fillStyle = player.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();

            if (!kickedBall.active && gameState !== 'FIELD_GOAL_AIMING' && gameState !== 'PUNT_AIMING' && gameState !== 'PASS_IN_AIR') {
                ctx.beginPath(); ctx.ellipse(pScreenX + pRadiusPx*0.4, pScreenY - pRadiusPx*0.2, pRadiusPx*0.5, pRadiusPx*0.3, Math.PI/4, 0, Math.PI*2);
                ctx.fillStyle = '#8b4513'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
            }
        }

        if (gameState === 'PASS_IN_AIR' && passObj.active) {
            const bScreenX = getScreenX(passObj.x); const bScreenY = getScreenY(passObj.y);
            const bRadiusPx = (player.radius * 0.6) * ppy * passObj.size;
            ctx.beginPath(); ctx.ellipse(bScreenX, bScreenY, bRadiusPx, bRadiusPx*0.6, Math.PI/4, 0, Math.PI*2);
            ctx.fillStyle = '#8b4513'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bScreenX - bRadiusPx*0.5, bScreenY); ctx.lineTo(bScreenX + bRadiusPx*0.5, bScreenY); ctx.stroke();
        }

        // Draw ball for Kicks and Kickoffs
        if ((gameState === 'FIELD_GOAL_KICKED' || gameState === 'PUNT_KICKED' || gameState === 'KICKOFF_IN_AIR') && kickedBall.active) {
            const bScreenX = getScreenX(kickedBall.x); const bScreenY = getScreenY(kickedBall.y);
            const bRadiusPx = (player.radius * 0.6) * ppy * kickedBall.size;
            ctx.beginPath(); ctx.ellipse(bScreenX, bScreenY, bRadiusPx, bRadiusPx*0.6, 0, 0, Math.PI*2);
            ctx.fillStyle = '#8b4513'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bScreenX - bRadiusPx*0.5, bScreenY); ctx.lineTo(bScreenX + bRadiusPx*0.5, bScreenY); ctx.stroke();
        }

        if (gameState === 'FIELD_GOAL_AIMING' || gameState === 'PUNT_AIMING') {
            const meterWidth = ppy * 16; const meterHeight = ppy * 1.5;
            const meterX = getScreenX(FIELD_WIDTH_YARDS/2) - meterWidth/2; const meterY = getScreenY(player.y) - ppy * 5;
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(meterX, meterY, meterWidth, meterHeight);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(meterX, meterY, meterWidth, meterHeight);
            const goodZoneW = meterWidth * 0.2; const goodZoneX = meterX + (meterWidth/2) - (goodZoneW/2);
            ctx.fillStyle = '#10b981'; ctx.fillRect(goodZoneX, meterY, goodZoneW, meterHeight);
            const cursorX = meterX + (kickingMeter.pos / 100) * meterWidth;
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(cursorX - 2, meterY - 4, 4, meterHeight + 8);
        }

        for (let def of defenders) {
            const dScreenX = getScreenX(def.x); const dScreenY = getScreenY(def.y); const dRadiusPx = def.radius * ppy;
            ctx.beginPath(); ctx.arc(dScreenX, dScreenY, dRadiusPx, 0, Math.PI * 2);
            ctx.fillStyle = def.stunTimer > 0 ? '#9ca3af' : def.color; // Gray out if stunned (broken tackle)
            ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000000'; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(dScreenX - dRadiusPx*0.4, dScreenY - dRadiusPx*0.2); ctx.lineTo(dScreenX + dRadiusPx*0.4, dScreenY + dRadiusPx*0.2);
            ctx.moveTo(dScreenX + dRadiusPx*0.4, dScreenY - dRadiusPx*0.2); ctx.lineTo(dScreenX - dRadiusPx*0.4, dScreenY + dRadiusPx*0.2);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
        }
    }

    // Ring + label on a controlled player, or an edge arrow when he is off screen
    function drawMarker(ent, color, label) {
        const sx = getScreenX(ent.x); const sy = getScreenY(ent.y);
        const top = 90; const bottom = canvas.height - 40;
        if (sy < top || sy > bottom) {
            const dir = sy < top ? -1 : 1;
            const ay = sy < top ? top : bottom;
            ctx.beginPath(); ctx.moveTo(sx, ay + dir * 12); ctx.lineTo(sx - 11, ay - dir * 6); ctx.lineTo(sx + 11, ay - dir * 6); ctx.closePath();
            ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
            return;
        }
        const radius = (ent.radius || player.radius) * ppy * (1.6 + 0.2 * Math.sin(performance.now() / 120));
        ctx.beginPath(); ctx.arc(sx, sy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
        if (label) {
            ctx.font = `bold ${Math.max(11, ppy * 0.9)}px 'Russo One', sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(label, sx, sy - radius - 2);
            ctx.fillStyle = color; ctx.fillText(label, sx, sy - radius - 2);
        }
    }

    function drawControlMarkers() {
        if (net.role === 'solo' || gameState === 'MENU' || gameState === 'GAME_OVER') return;
        const onDefense = possession !== mySide;
        const humanDef = defenders.find(d => d.human);
        if (humanDef) drawMarker(humanDef, onDefense ? '#fde047' : 'rgba(255,255,255,0.55)', onDefense ? 'YOU' : null);
        if (!onDefense && (gameState === 'PRE_SNAP' || gameState === 'PLAYING')) drawMarker(player, '#fde047', 'YOU');
    }

    // --- RENDER LOOP ---

    let lastFrameTime = performance.now();
    function frame(now) {
        const dt = Math.min(0.1, Math.max(0, (now - lastFrameTime) / 1000));
        lastFrameTime = now;

        computeLocalInput(now);
        pumpSim();
        if (net.role === 'guest') updateGuestView(performance.now());

        updateCamera(dt);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawField();
        drawEntities();
        drawControlMarkers();

        renderHUD(net.role === 'guest' ? guestHud : hudState);
        syncControls();
        requestAnimationFrame(frame);
    }

    // Start loop with timestamp
    requestAnimationFrame((timestamp) => {
        lastFrameTime = timestamp;
        frame(timestamp);
    });

    // Opening a shared invite link (?join=CODE) joins straight away
    const inviteCode = new URLSearchParams(location.search).get('join');
    if (inviteCode) joinRoom(inviteCode);
    else showHome();

</script>
</body>
</html>
